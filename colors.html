<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Generator - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .color-swatch {
      height: 250px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 1px solid var(--cl-line);
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      font-weight: 800;
    }
    .color-swatch:hover {
      transform: scale(1.05);
    }
    .controls-panel {
      background: var(--cl-surface);
      padding: 30px;
      border-radius: var(--cl-radius);
      border: 1px solid var(--cl-line);
      margin-bottom: 40px;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-generate {
      background: var(--cl-brand);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="course-container" style="max-width: 1200px;">
  <div class="course-header">
    <h1><i class="fa-solid fa-palette"></i> Palette Generator</h1>
    <p>Create professional, harmonious color schemes for your next design project.</p>
  </div>

  <div class="controls-panel reveal">
    <input type="color" id="baseColor" value="#3b82f6" style="width: 80px; height: 50px; cursor: pointer;">
    <select id="paletteType" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--cl-line); background: var(--cl-bg); color: var(--cl-ink);">
      <option value="monochromatic">Monochromatic</option>
      <option value="analogous">Analogous</option>
      <option value="complementary">Complementary</option>
      <option value="triadic">Triadic</option>
    </select>
    <button class="btn-generate" id="generateBtn">Generate New</button>
  </div>

  <div class="palette-grid" id="paletteGrid"></div>
</div>

<div id="toast" style="position: fixed; bottom: 20px; right: 20px; background: var(--cl-brand); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 700; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 10000;">Copied!</div>

<script src="site-polish.js"></script>
<script>
  const paletteGrid = document.getElementById('paletteGrid');
  const baseColor = document.getElementById('baseColor');
  const paletteType = document.getElementById('paletteType');
  const generateBtn = document.getElementById('generateBtn');

  function hexToHSL(H) {
    let r = 0, g = 0, b = 0;
    if (H.length == 4) {
      r = "0x" + H[1] + H[1]; g = "0x" + H[2] + H[2]; b = "0x" + H[3] + H[3];
    } else if (H.length == 7) {
      r = "0x" + H[1] + H[2]; g = "0x" + H[3] + H[4]; b = "0x" + H[5] + H[6];
    }
    r /= 255; g /= 255; b /= 255;
    let cmin = Math.min(r,g,b), cmax = Math.max(r,g,b), delta = cmax - cmin, h = 0, s = 0, l = 0;
    if (delta == 0) h = 0;
    else if (cmax == r) h = ((g - b) / delta) % 6;
    else if (cmax == g) h = (b - r) / delta + 2;
    else h = (r - g) / delta + 4;
    h = Math.round(h * 60);
    if (h < 0) h += 360;
    l = (cmax + cmin) / 2;
    s = delta == 0 ? 0 : delta / (1 - Math.abs(2 * l - 1));
    s = +(s * 100).toFixed(1);
    l = +(l * 100).toFixed(1);
    return {h, s, l};
  }

  function HSLToHex(h,s,l) {
    s /= 100; l /= 100;
    let c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c/2, r = 0, g = 0, b = 0;
    if (0 <= h && h < 60) { r = c; g = x; b = 0; }
    else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
    else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
    else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
    else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
    else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
    r = Math.round((r + m) * 255).toString(16);
    g = Math.round((g + m) * 255).toString(16);
    b = Math.round((b + m) * 255).toString(16);
    if (r.length == 1) r = "0" + r;
    if (g.length == 1) g = "0" + g;
    if (b.length == 1) b = "0" + b;
    return "#" + r + g + b;
  }

  function generate() {
    const base = hexToHSL(baseColor.value);
    const type = paletteType.value;
    const colors = [];

    if (type === 'monochromatic') {
      for(let i=0; i<5; i++) colors.push(HSLToHex(base.h, base.s, 10 + i*20));
    } else if (type === 'analogous') {
      for(let i=0; i<5; i++) colors.push(HSLToHex((base.h + i*30) % 360, base.s, base.l));
    } else if (type === 'complementary') {
      colors.push(HSLToHex(base.h, base.s, base.l));
      colors.push(HSLToHex(base.h, base.s, base.l - 20));
      colors.push(HSLToHex((base.h + 180) % 360, base.s, base.l));
      colors.push(HSLToHex((base.h + 180) % 360, base.s, base.l - 20));
      colors.push(HSLToHex(base.h, base.s, 90));
    } else {
      colors.push(HSLToHex(base.h, base.s, base.l));
      colors.push(HSLToHex((base.h + 120) % 360, base.s, base.l));
      colors.push(HSLToHex((base.h + 240) % 360, base.s, base.l));
      colors.push(HSLToHex(base.h, base.s, 20));
      colors.push(HSLToHex(base.h, base.s, 90));
    }

    paletteGrid.innerHTML = '';
    colors.forEach(c => {
      const el = document.createElement('div');
      el.className = 'color-swatch';
      el.style.backgroundColor = c;
      el.innerHTML = `<span>${c.toUpperCase()}</span>`;
      el.onclick = () => {
        navigator.clipboard.writeText(c);
        const toast = document.getElementById('toast');
        toast.style.opacity = '1';
        toast.style.transform = 'translateY(0)';
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(100px)';
        }, 2000);
      };
      paletteGrid.appendChild(el);
    });
  }

  generateBtn.onclick = generate;
  generate();
</script>
</body>
</html>
