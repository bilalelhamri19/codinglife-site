<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet PHP - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #777bb322;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #777bb3;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #777bb3, #4f5b93) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-php"></i> PHP Backend Mastery</h1>
      <p>Master server-side programming and dynamic web development with PHP.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-php"></i> إتقان PHP</h1>
      <p>احترف برمجة السيرفر وتطوير الويب الديناميكي باستخدام PHP.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-php"></i> Maîtrise PHP</h1>
      <p>Maîtrisez la programmation côté serveur et le développement web dynamique.</p>
    </div>
  </div>

  <div class="chapters" id="phpLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const phpLessons = [
    {
      icon: "fa-server",
      t_fr: "1. Qu’est-ce que PHP ?",
      d_fr: "PHP (Hypertext Preprocessor) est un langage de script côté serveur utilisé pour créer des sites dynamiques.",
      t_en: "1. What is PHP?",
      d_en: "PHP is a server-side scripting language used to create dynamic websites.",
      t_ar: "1. ما هو PHP؟",
      d_ar: "PHP هي لغة برمجة نصية من جهة الخادم تُستخدم لإنشاء مواقع ديناميكية."
    },
    {
      icon: "fa-code",
      t_fr: "2. Syntaxe de base",
      code: `<?php\necho "Bonjour";\n?>`,
      d_fr: "Le code PHP est entouré par les balises <code>&lt;?php ... ?&gt;</code>.",
      t_en: "2. Basic Syntax",
      d_en: "PHP code is wrapped in <code>&lt;?php ... ?&gt;</code> tags.",
      t_ar: "2. الأساسيات",
      d_ar: "كود PHP يتم وضعه داخل وسوم <code>&lt;?php ... ?&gt;</code>."
    },
    {
      icon: "fa-vial",
      t_fr: "3. Variables & Constantes",
      code: `$nom = "Ali";\ndefine("SITE", "Coding Life");`,
      d_fr: "En PHP, les variables commencent par un signe dollar <code>$</code>.",
      t_en: "3. Variables & Constants",
      d_en: "In PHP, variables start with a dollar sign <code>$</code>.",
      t_ar: "3. المتغيرات والثوابت",
      d_ar: "في PHP، تبدأ المتغيرات بعلامة الدولار <code>$</code>."
    },
    {
      icon: "fa-database",
      t_fr: "4. Types de données",
      d_fr: "Chaînes de caractères, entiers, booléens, tableaux et objets.",
      t_en: "4. Data Types",
      d_en: "Strings, integers, booleans, arrays, and objects.",
      t_ar: "4. أنواع البيانات",
      d_ar: "النصوص، الأرقام، القيم المنطقية، المصفوفات والكائنات."
    },
    {
      icon: "fa-list",
      t_fr: "5. Tableaux (Arrays)",
      code: `$fruits = ["Pomme", "Banane"];\necho $fruits[0];`,
      d_fr: "PHP supporte les tableaux indexés et associatifs (clé => valeur).",
      t_en: "5. Arrays",
      d_en: "PHP supports indexed and associative arrays (key => value).",
      t_ar: "5. المصفوفات",
      d_ar: "تدعم PHP المصفوفات المفهرسة والمترابطة."
    },
    {
      icon: "fa-gears",
      t_fr: "6. Fonctions",
      code: `function saluer($nom) {\n  return "Bonjour " . $nom;\n}`,
      d_fr: "Créez vos propres fonctions pour réutiliser votre code.",
      t_en: "6. Functions",
      d_en: "Create your own functions to reuse code throughout your app.",
      t_ar: "6. الدوال",
      d_ar: "أنشئ دوالك الخاصة لإعادة استخدام الكود."
    },
    {
      icon: "fa-wpforms",
      t_fr: "7. Gestion des Formulaires",
      badge: "badge-important",
      code: `$_POST["nom"];\n$_GET["id"];`,
      d_fr: "Récupérer des données envoyées via les méthodes GET et POST.",
      t_en: "7. Form Handling",
      d_en: "Retrieve data sent via GET and POST methods.",
      t_ar: "7. التعامل مع النماذج",
      d_ar: "استقبال البيانات المرسلة عبر طرق GET و POST."
    },
    {
      icon: "fa-database",
      t_fr: "8. Connexion MySQL (PDO)",
      badge: "badge-pro",
      code: `$pdo = new PDO("mysql:host=localhost;dbname=test", "user", "pass");`,
      d_fr: "Connectez votre application à une base de données MySQL avec PDO.",
      t_en: "8. MySQL Connection (PDO)",
      d_en: "Connect your app to a MySQL database using PDO safely.",
      t_ar: "8. الاتصال بقاعدة البيانات",
      d_ar: "ربط تطبيقك بقاعدة بيانات MySQL باستخدام PDO."
    },
    {
      icon: "fa-shield",
      t_fr: "9. Sécurité PHP",
      badge: "badge-important",
      d_fr: "Évitez les injections SQL en utilisant des requêtes préparées.",
      t_en: "9. PHP Security",
      d_en: "Avoid SQL injections by using prepared statements.",
      t_ar: "9. أمن PHP",
      d_ar: "تجنب هجمات SQL injection باستخدام الاستعلامات المحضرة."
    },
    {
      icon: "fa-cookie",
      t_fr: "10. Sessions & Cookies",
      code: `session_start();\n$_SESSION["user"] = "Ali";`,
      d_fr: "Gérer l'authentification des utilisateurs avec les sessions.",
      t_en: "10. Sessions & Cookies",
      d_en: "Manage user authentication using PHP sessions.",
      t_ar: "10. الجلسات والكوكيز",
      d_ar: "إدارة مصادقة المستخدمين باستخدام الجلسات."
    },
    {
      icon: "fa-dna",
      t_fr: "11. POO en PHP",
      badge: "badge-pro",
      code: `class User {\n  public $nom;\n}`,
      d_fr: "Utilisez les classes et objets pour structurer votre backend.",
      t_en: "11. OOP in PHP",
      d_en: "Use classes and objects to structure your backend code.",
      t_ar: "11. البرمجة الكائنية",
      d_ar: "استخدام الكلاسات والكائنات لتنظيم الكود."
    },
    {
      icon: "fa-check-double",
      t_fr: "12. Bonnes pratiques",
      d_fr: "Suivez les standards PSR et gardez votre code propre.",
      t_en: "12. Best Practices",
      d_en: "Follow PSR standards and keep your code clean.",
      t_ar: "12. أفضل الممارسات",
      d_ar: "اتبع معايير PSR وحافظ على نظافة الكود."
    }
  ];

  const chaptersContainer = document.getElementById('phpLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  phpLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
