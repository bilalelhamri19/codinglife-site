<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet SQL - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #00758f22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #00758f;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #00758f, #005a6d) !important;">
    <div data-cl-lang="en">
      <h1><i class="fas fa-database"></i> SQL Data Mastery</h1>
      <p>Master the language used to communicate with databases world-wide.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fas fa-database"></i> إتقان SQL</h1>
      <p>احترف اللغة المستخدمة للتواصل مع قواعد البيانات في جميع أنحاء العالم.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fas fa-database"></i> Maîtrise SQL</h1>
      <p>Maîtrisez le langage utilisé pour communiquer avec les bases de données.</p>
    </div>
  </div>

  <div class="chapters" id="sqlLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const sqlLessons = [
    {
      icon: "fa-database",
      t_fr: "1. Qu’est-ce que SQL ?",
      d_fr: "SQL (Structured Query Language) est utilisé pour gérer et manipuler des bases de données relationnelles.",
      t_en: "1. What is SQL?",
      d_en: "SQL (Structured Query Language) is used to manage and manipulate relational databases.",
      t_ar: "1. ما هو SQL؟",
      d_ar: "SQL هي اللغة المستخدمة لإدارة والتحكم في قواعد البيانات العلائقية."
    },
    {
      icon: "fa-filter",
      t_fr: "2. SELECT : Récupérer des données",
      code: `SELECT nom, age FROM utilisateurs;`,
      d_fr: "L'instruction SELECT est utilisée pour extraire des données d'une table.",
      t_en: "2. SELECT: Retrieve Data",
      d_en: "The SELECT statement is used to fetch data from a table.",
      t_ar: "2. SELECT: جلب البيانات",
      d_ar: "يُستخدم أمر SELECT لاستخراج البيانات من الجدول."
    },
    {
      icon: "fa-magnifying-glass",
      t_fr: "3. WHERE : Filtrer les résultats",
      code: `SELECT * FROM utilisateurs\nWHERE age > 18;`,
      d_fr: "Utilisez WHERE pour filtrer les enregistrements selon des conditions.",
      t_en: "3. WHERE: Filter Results",
      d_en: "Use WHERE to filter records based on specific conditions.",
      t_ar: "3. WHERE: تصفية النتائج",
      d_ar: "استخدم WHERE لتصفية السجلات بناءً على شروط معينة."
    },
    {
      icon: "fa-plus",
      t_fr: "4. INSERT : Ajouter des données",
      code: `INSERT INTO utilisateurs (nom, age)\nVALUES ('Ali', 20);`,
      d_fr: "L'instruction INSERT INTO est utilisée pour ajouter de nouvelles lignes.",
      t_en: "4. INSERT: Add Data",
      d_en: "The INSERT INTO statement is used to add new rows to a table.",
      t_ar: "4. INSERT: إضافة بيانات",
      d_ar: "يُستخدم أمر INSERT INTO لإضافة صفوف جديدة للجدول."
    },
    {
      icon: "fa-pen",
      t_fr: "5. UPDATE : Modifier des données",
      badge: "badge-important",
      code: `UPDATE utilisateurs\nSET age = 21\nWHERE nom = 'Ali';`,
      d_fr: "Modifiez les enregistrements existants avec UPDATE. N'oubliez pas le WHERE !",
      t_en: "5. UPDATE: Modify Data",
      d_en: "Modify existing records with UPDATE. Don't forget the WHERE clause!",
      t_ar: "5. UPDATE: تعديل البيانات",
      d_ar: "تعديل السجلات الموجودة. لا تنسَ جملة WHERE!"
    },
    {
      icon: "fa-trash",
      t_fr: "6. DELETE : Supprimer des données",
      badge: "badge-important",
      code: `DELETE FROM utilisateurs\nWHERE id = 5;`,
      d_fr: "Supprimez des lignes de la table avec DELETE.",
      t_en: "6. DELETE: Remove Data",
      d_en: "Remove rows from a table using the DELETE statement.",
      t_ar: "6. DELETE: حذف البيانات",
      d_ar: "حذف الصفوف من الجدول."
    },
    {
      icon: "fa-link",
      t_fr: "7. JOINS : Relier les tables",
      badge: "badge-pro",
      code: `SELECT * FROM commandes\nJOIN clients ON commandes.id = clients.id;`,
      d_fr: "Combinez des lignes de deux ou plusieurs tables avec JOIN.",
      t_en: "7. JOINS: Linking Tables",
      d_en: "Combine rows from two or more tables using the JOIN clause.",
      t_ar: "7. JOINS: ربط الجداول",
      d_ar: "دمج الصفوف من جدولين أو أكثر."
    }
  ];

  const chaptersContainer = document.getElementById('sqlLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  sqlLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
