<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet Node.js - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #68a06322;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #68a063;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #333333, #68a063) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-node-js"></i> Node.js Backend Mastery</h1>
      <p>Build scalable server-side applications using JavaScript on the V8 engine.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-node-js"></i> إتقان Node.js</h1>
      <p>بناء تطبيقات سيرفر قابلة للتوسع باستخدام جافا سكريبت على محرك V8.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-node-js"></i> Maîtrise Node.js</h1>
      <p>Créez des applications côté serveur évolutives en utilisant JavaScript.</p>
    </div>
  </div>

  <div class="chapters" id="nodeLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const nodeLessons = [
    {
      icon: "fa-server",
      t_fr: "1. Qu’est-ce que Node.js ?",
      d_fr: "Node.js est un environnement d'exécution JavaScript côté serveur basé sur le moteur V8 de Chrome.",
      t_en: "1. What is Node.js?",
      d_en: "Node.js is a JavaScript runtime built on Chrome's V8 JavaScript engine for server-side execution.",
      t_ar: "1. ما هو Node.js؟",
      d_ar: "Node.js هي بيئة تشغيل جافا سكريبت من جهة الخادم تعتمد على محرك V8."
    },
    {
      icon: "fa-cube",
      t_fr: "2. NPM & Modules",
      code: `npm install express`,
      d_fr: "Utilisez NPM pour gérer les paquets et bibliothèques de votre projet.",
      t_en: "2. NPM & Modules",
      d_en: "Use NPM (Node Package Manager) to manage project dependencies and libraries.",
      t_ar: "2. NPM والوحدات",
      d_ar: "استخدام NPM لإدارة مكتبات المشروع."
    },
    {
      icon: "fa-bolt",
      t_fr: "3. Express.js",
      badge: "badge-important",
      code: `const express = require('express');\nconst app = express();`,
      d_fr: "Le framework le plus populaire pour créer des APIs et des serveurs web avec Node.",
      t_en: "3. Express.js",
      d_en: "The most popular framework for building APIs and web servers with Node.js.",
      t_ar: "3. Express.js",
      d_ar: "أشهر إطار عمل لبناء الـ APIs وسيرفرات الويب."
    },
    {
      icon: "fa-file-code",
      t_fr: "4. File System (fs)",
      code: `const fs = require('fs');\nfs.writeFileSync('test.txt', 'Salut');`,
      d_fr: "Apprenez à lire et écrire des fichiers directement sur le serveur.",
      t_en: "4. File System (fs)",
      d_en: "Learn how to read and write files directly on the server's filesystem.",
      t_ar: "4. نظام الملفات",
      d_ar: "تعلم كيفية القراءة والكتابة في الملفات على السيرفر."
    }
  ];

  const chaptersContainer = document.getElementById('nodeLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  nodeLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
