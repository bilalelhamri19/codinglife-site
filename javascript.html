<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet JavaScript - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #f7df1e22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #e5a50a;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #f7df1e, #e5a50a) !important; color: #000 !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-js"></i> JavaScript Deep Dive</h1>
      <p>The logic engine of the web. From ES6+ fundamentals to advanced asynchronous patterns.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-js"></i> تعمق في JavaScript</h1>
      <p>محرك المنطق للويب. من أساسيات ES6+ إلى الأنماط المتقدمة غير المتزامنة.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-js"></i> Maîtrise JavaScript</h1>
      <p>Le moteur du web. Des fondamentaux ES6+ aux modèles asynchrones avancés.</p>
    </div>
  </div>

  <div class="chapters" id="jsLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const jsLessons = [
    {
      icon: "fa-bolt",
      badge: "badge-modern",
      t_fr: "1. Qu'est-ce que JavaScript ?",
      d_fr: "JavaScript est le langage de programmation qui permet de rendre les sites web interactifs.",
      t_en: "1. What is JavaScript?",
      d_en: "JavaScript is the programming language that powers interactivity on the web.",
      t_ar: "1. ما هو JavaScript؟",
      d_ar: "جافا سكريبت هي لغة البرمجة التي تسمح بجعل مواقع الويب تفاعلية."
    },
    {
      icon: "fa-vial",
      badge: "badge-important",
      t_fr: "2. Variables et Types",
      d_fr: "Utilisez let et const (ES6) pour déclarer des variables. Découvrez les types : String, Number, Boolean, Array, Object.",
      code: "const nom = 'Ali';\nlet age = 25;\nconst fruits = ['Pomme', 'Banane'];",
      t_en: "2. Variables & Types",
      d_en: "Use let and const (ES6) to declare variables. Explore types: String, Number, Boolean, Array, Object.",
      t_ar: "2. المتغيرات والأنواع",
      d_ar: "استخدم let و const للتصريح عن المتغيرات. استكشف الأنواع المختلفة."
    },
    {
      icon: "fa-code-branch",
      badge: "badge-modern",
      t_fr: "3. Conditions et Logique",
      d_fr: "Prenez des décisions avec if/else, switch et les opérateurs logiques (&&, ||, !).",
      code: "if (age >= 18) {\n  console.log('Majeur');\n}",
      t_en: "3. Logic & Conditions",
      d_en: "Make decisions in code using if/else statements, switch cases, and logical operators.",
      t_ar: "3. المنطق والشروط",
      d_ar: "اتخذ القرارات في الكود باستخدام if/else والمعاملات المنطقية."
    },
    {
      icon: "fa-sync",
      badge: "badge-modern",
      t_fr: "4. Boucles",
      d_fr: "Répétez des actions avec for, while et les méthodes d'itération modernes comme forEach.",
      code: "fruits.forEach(f => console.log(f));",
      t_en: "4. Loops",
      d_en: "Repeat actions using for, while, and modern iteration methods like forEach and map.",
      t_ar: "4. الحلقات",
      d_ar: "كرر الأفعال باستخدام الحلقات مثل for و while و forEach."
    },
    {
      icon: "fa-rocket",
      badge: "badge-important",
      t_fr: "5. Fonctions et ES6",
      d_fr: "Découvrez les Arrow Functions et comment passer des arguments.",
      code: "const saluer = (nom) => `Salut ${nom}!`;",
      t_en: "5. Functions & ES6",
      d_en: "Learn about Arrow Functions, parameters, return values, and template literals.",
      t_ar: "5. الدوال و ES6",
      d_ar: "تعلم عن الدوال السهمية (Arrow Functions) والمميزات الحديثة لـ ES6."
    },
    {
      icon: "fa-cube",
      badge: "badge-pro",
      t_fr: "6. Objets et Classes",
      d_fr: "La programmation orientée objet en JS utilisant les classes et les prototypes.",
      code: "class User {\n  constructor(name) { this.name = name; }\n}",
      t_en: "6. Objects & Classes",
      d_en: "Object-oriented programming in JS using modern class syntax and prototypes.",
      t_ar: "6. الكائنات والكلاسات",
      d_ar: "البرمجة كائنية التوجه في جافا سكريبت باستخدام الكلاسات."
    },
    {
      icon: "fa-sitemap",
      badge: "badge-important",
      t_fr: "7. Manipulation du DOM",
      d_fr: "Interagissez avec le HTML en sélectionnant et modifiant des éléments en temps réel.",
      code: "document.querySelector('h1').innerText = 'Nouveau Titre';",
      t_en: "7. DOM Manipulation",
      d_en: "Interact with HTML by selecting and modifying elements dynamically.",
      t_ar: "7. التلاعب بـ DOM",
      d_ar: "تفاعل مع الـ HTML عبر اختيار وتعديل العناصر برمجياً."
    },
    {
      icon: "fa-mouse",
      badge: "badge-modern",
      t_fr: "8. Événements",
      d_fr: "Écoutez les clics, les saisies clavier et les soumissions de formulaires.",
      code: "btn.addEventListener('click', () => alert('Cliqué!'));",
      t_en: "8. Events",
      d_en: "Listen for user interactions like clicks, key presses, and form submissions.",
      t_ar: "8. الأحداث",
      d_ar: "استمع لتفاعلات المستخدم مثل النقرات وإدخالات لوحة المفاتيح."
    },
    {
      icon: "fa-clock",
      badge: "badge-pro",
      t_fr: "9. Programmation Asynchrone",
      d_fr: "Maîtrisez les Promises et async/await pour gérer les appels API et les délais.",
      code: "async function getData() {\n  const res = await fetch(url);\n}",
      t_en: "9. Async JS",
      d_en: "Master Promises and async/await to handle API calls and delayed execution.",
      t_ar: "9. البرمجة غير المتزامنة",
      d_ar: "أتقن الوعود (Promises) و async/await للتعامل مع الـ APIs."
    },
    {
      icon: "fa-box-open",
      badge: "badge-pro",
      t_fr: "10. Modules et JSON",
      d_fr: "Organisez votre code avec import/export et apprenez à manipuler les données JSON.",
      code: "import { data } from './utils.js';\nconst obj = JSON.parse(jsonStr);",
      t_en: "10. Modules & JSON",
      d_en: "Organize your code with ES Modules and learn to handle JSON data structures.",
      t_ar: "10. الموديولات و JSON",
      d_ar: "نظم كودك باستخدام الموديولات وتعلم التعامل مع بيانات JSON."
    }
  ];

  const chaptersContainer = document.getElementById('jsLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  jsLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
