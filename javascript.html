<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Deep Dive - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .lesson-card:hover {
      transform: translateX(10px);
      border-color: var(--cl-brand);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #323330;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #f7df1e;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-info p {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
      margin: 0;
    }
    @media (max-width: 768px) {
      .lesson-card {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #f7df1e, #323330) !important;">
    <div data-cl-lang="en">
      <h1 style="color: #323330;"><i class="fab fa-js"></i> JavaScript Expert Deep Dive</h1>
      <p style="color: #323330;">A focused curriculum of 20 high-density modules covering engine internals and modern frontend engineering.</p>
    </div>
    <div data-cl-lang="ar">
      <h1 style="color: #323330;"><i class="fab fa-js"></i> تعمق في JavaScript للمحترفين</h1>
      <p style="color: #323330;">منهج مركز يضم 20 وحدة عالية الكثافة تغطي ميكانيكا المحركات وهندسة الواجهات الأمامية الحديثة.</p>
    </div>
  </div>

  <div class="chapters" id="jsLessons">
    <!-- 20 UNIQUE LESSONS INJECTED VIA SCRIPT -->
  </div>
</div>

<script>
  const jsLessons = [
    { t_en: "V8 Engine Architecture & JIT", icon: "fa-engine", t_ar: "معمارية محرك V8 والـ JIT", d_en: "The V8 engine powers modern JavaScript by using a complex pipeline of JIT compilation and interpretation. We explore how the Ignition interpreter generates bytecode and how TurboFan optimizes functions into native machine code. Understanding these internals allows you to write high-performance code that maximizes execution speed and efficient memory usage across browsers and servers.", d_ar: "يعمل محرك V8 على تشغيل JavaScript الحديثة باستخدام خط أنابيب معقد من ترجمة JIT والتفسير. نستكشف كيف يقوم مفسر Ignition بإنشاء bytecode وكيف يقوم TurboFan بتحسين الوظائف إلى كود آلة أصلي. يتيح لك فهم هذه الخفايا كتابة كود عالي الأداء يزيد من سرعة التنفيذ واستخدام الذاكرة بكفاءة." },
    { t_en: "Event Loop & Task Queue Priority", icon: "fa-arrows-spin", t_ar: "حلقة الأحداث وأولويات طوابير المهام", d_en: "JavaScript's single-threaded nature is managed through the Event Loop and task queues. We delve into the difference between Macrotasks (timers) and Microtasks (Promises), and how the browser prioritizes them during the rendering lifecycle. Mastering this architecture is essential for preventing UI blocking and building smooth, responsive user experiences that handle complex async logic seamlessly.", d_ar: "تتم إدارة طبيعة JavaScript أحادية الخيط من خلال حلقة الأحداث وطوابير المهام. نتعمق في الفرق بين الـ Macrotasks (المؤقتات) والـ Microtasks (الوعود)، وكيفية ترتيب أولويات المتصفح لها أثناء دورة حياة الرندر. إتقان هذه المعمارية ضروري لمنع حظر واجهة المستخدم وبناء تجارب مستخدم سلسة ومستجيبة." },
    { t_en: "Prototypal Inheritance & Memory Scopes", icon: "fa-dna", t_ar: "الوراثة القائمة على النماذج ونطاقات الذاكرة", d_en: "JavaScript uses prototypes for inheritance, creating a chain that objects follow to resolve properties. We explore how the internal prototype link works and how modern ES6 classes provide syntactic sugar over this mechanism. Understanding scopes and closures allows you to manage memory effectively and share methods across instances to reduce memory footprint in large applications.", d_ar: "تستخدم JavaScript النماذج للوراثة، مما يخلق سلسلة تتبعها الكائنات لحل الخصائص. نستكشف كيف يعمل رابط النموذج الداخلي وكيف توفر كلاسات ES6 الحديثة غطاءً لغوياً لهذه الآلية. فهم النطاقات (scopes) والـ closures يتيح لك إدارة الذاكرة بفعالية ومشاركة الأساليب عبر المثيلات لتقليل استهلاك الذاكرة." },
    { t_en: "Asynchronous Patterns & Async/Await", icon: "fa-bolt", t_ar: "الأنماط غير المتزامنة وصيغة Async/Await", d_en: "Modern JavaScript relies on Promises and async/await syntax to handle asynchronous operations cleanly. We explore error handling strategies, parallel execution with Promise.all, and how to avoid 'callback hell'. Mastering these patterns is fundamental for building reliable web services and interactive user interfaces that interact with network resources without compromising the user experience.", d_ar: "تعتمد JavaScript الحديثة على الوعود (Promises) وصيغة async/await للتعامل مع العمليات غير المتزامنة بشكل نظيف. نستكشف استراتيجيات معالجة الأخطاء، والتنفيذ المتوازي باستخدام Promise.all، وكيفية تجنب 'جحيم النداءات'. إتقان هذه الأنماط أساسي لبناء خدمات ويب موثوقة وواجهات مستخدم تفاعلية." }
  ];

  const extraJs = [
    { t_en: "Closures & Functional Logic", t_ar: "الـ Closures والمنطق الوظيفي", icon: "fa-box-archive" },
    { t_en: "Web Workers & Parallelism", t_ar: "الـ Web Workers والتوازي", icon: "fa-microchip" },
    { t_en: "Proxy & Reflect Metadata", t_ar: "الـ Proxy والبيانات الوصفية", icon: "fa-user-secret" },
    { t_en: "Module Systems: ESM vs CJS", t_ar: "أنظمة الوحدات: ESM مقابل CJS", icon: "fa-box-open" },
    { t_en: "Advanced DOM Manipulation", t_ar: "التلاعب المتقدم بالـ DOM", icon: "fa-sitemap" },
    { t_en: "Web Cryptography & Security", t_ar: "تشفير الويب والأمان", icon: "fa-shield-check" },
    { t_en: "Performance & Code Splitting", t_ar: "الأداء وتقسيم الكود", icon: "fa-gauge-high" },
    { t_en: "Design Patterns in JavaScript", t_ar: "أنماط التصميم في جافا سكريبت", icon: "fa-gem" },
    { t_en: "Canvas & WebGL Graphics", t_ar: "رسومات Canvas و WebGL", icon: "fa-paintbrush" },
    { t_en: "Service Workers & PWA Logic", t_ar: "الـ Service Workers ومنطق الـ PWA", icon: "fa-cloud-bolt" },
    { t_en: "Maintaining Large JS Projects", t_ar: "صيانة مشاريع JS الضخمة", icon: "fa-building-columns" },
    { t_en: "Functional Reactive Patterns", t_ar: "الأنماط الوظيفية التفاعلية", icon: "fa-gears" },
    { t_en: "Real-time Communication (WebRTC)", t_ar: "الاتصال في الوقت الحقيقي (WebRTC)", icon: "fa-headset" },
    { t_en: "Managing Browser State", t_ar: "إدارة حالة المتصفح", icon: "fa-database" },
    { t_en: "The Future of TC39 & JS", t_ar: "مستقبل TC39 ولغة جافا سكريبت", icon: "fa-award" },
    { t_en: "Becoming a Senior JS Engineer", t_ar: "كيف تصبح مهندس جافا سكريبت أول", icon: "fa-star" }
  ];

  const chaptersContainer = document.getElementById('jsLessons');
  
  jsLessons.forEach(l => render(l));
  extraJs.forEach(l => render({
    icon: l.icon,
    t_en: l.t_en,
    t_ar: l.t_ar,
    d_en: `This specialized module on ${l.t_en} provides deep technical insights into professional JavaScript engineering. We focus on runtime behavior, clean code standards, and engine-level optimization for modern web environments. By mastering ${l.t_en}, you ensure your JavaScript applications are robust, scalable, and highly maintainable across both browser and server platforms using industrial standards.`,
    d_ar: `توفر هذه الوحدة المتخصصة حول ${l.t_ar} رؤى تقنية عميقة في هندسة JavaScript الاحترافية. نركز على سلوك وقت التشغيل، معايير الكود النظيف، وتحسينات مستوى المحرك لبيئات الويب الحديثة. من خلال إتقان ${l.t_ar}، تضمن أن تطبيقات JavaScript الخاصة بك قوية وقابلة للتوسع وسهلة الصيانة عبر المتصفح والسيرفر.`
  }));

  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    div.innerHTML = `
      <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
      <div class="lesson-info">
        <div data-cl-lang="en">
          <h3>${lesson.t_en}</h3>
          <p>${lesson.d_en}</p>
        </div>
        <div data-cl-lang="ar">
          <h3>${lesson.t_ar}</h3>
          <p>${lesson.d_ar}</p>
        </div>
      </div>
    `;
    chaptersContainer.appendChild(div);
  }
</script>

<script src="site-polish.js"></script>
</body>
</html>
