<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet Python - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #3776ab22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #3776ab;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #3776ab, #ffde57) !important;">
    <div data-cl-lang="en">
      <h1 style="color: #0f172a;"><i class="fab fa-python"></i> Python Mastery</h1>
      <p style="color: #0f172a;">Learn one of the world's most versatile and powerful programming languages.</p>
    </div>
    <div data-cl-lang="ar">
      <h1 style="color: #0f172a;"><i class="fab fa-python"></i> إتقان Python</h1>
      <p style="color: #0f172a;">تعلم واحدة من أكثر لغات البرمجة تنوعاً وقوة في العالم.</p>
    </div>
    <div data-cl-lang="fr">
      <h1 style="color: #0f172a;"><i class="fab fa-python"></i> Maîtrise Python</h1>
      <p style="color: #0f172a;">Apprenez l'un des langages de programmation les plus polyvalents et les plus puissants.</p>
    </div>
  </div>

  <div class="chapters" id="pythonLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const pythonLessons = [
    {
      icon: "fa-rocket",
      t_fr: "1. Pourquoi Python ?",
      d_fr: "Python est célèbre pour sa simplicité et sa lisibilité. Il est utilisé partout : Web, Data Science, AI.",
      t_en: "1. Why Python?",
      d_en: "Python is famous for its simplicity and readability. It's used in Web, Data Science, and AI.",
      t_ar: "1. لماذا بايثون؟",
      d_ar: "تشتهر بايثون ببساطتها وسهولة قراءتها، وتستخدم في الويب، علوم البيانات، والذكاء الاصطناعي."
    },
    {
      icon: "fa-terminal",
      t_fr: "2. Installation & Hello World",
      code: `print("Hello World")`,
      d_fr: "Installez Python et créez votre premier script en quelques secondes.",
      t_en: "2. Installation & Hello World",
      d_en: "Install Python and run your first script in seconds.",
      t_ar: "2. التثبيت وأول برنامج",
      d_ar: "تثبيت بايثون وتشغيل أول برنامج لك في ثوانٍ."
    },
    {
      icon: "fa-vial",
      t_fr: "3. Variables & Types",
      code: `nom = "Ali"\nage = 20\npi = 3.14`,
      d_fr: "Pas besoin de déclarer le type en Python, c'est dynamique !",
      t_en: "3. Variables & Types",
      d_en: "No need to declare types in Python, it's dynamic!",
      t_ar: "3. المتغيرات والأنواع",
      d_ar: "لا داعي لتحديد النوع في بايثون، فهي لغة ديناميكية."
    },
    {
      icon: "fa-list",
      t_fr: "4. Listes & Tuples",
      code: `fruits = ["pomme", "banane"]\nfruits.append("orange")`,
      d_fr: "Les listes sont des collections ordonnées et modifiables.",
      t_en: "4. Lists & Tuples",
      d_en: "Lists are ordered and changeable collections.",
      t_ar: "4. القوائم والـ Tuples",
      d_ar: "القوائم هي مجموعات مرتبة وقابلة للتغيير."
    },
    {
      icon: "fa-address-book",
      t_fr: "5. Dictionnaires",
      code: `user = {"nom": "Ali", "age": 20}`,
      d_fr: "Stocker des données sous forme de clé: valeur.",
      t_en: "5. Dictionaries",
      d_en: "Store data in key: value pairs.",
      t_ar: "5. القواميس (Dictionaries)",
      d_ar: "تخزين البيانات في شكل مفتاح وقيمة."
    },
    {
      icon: "fa-gears",
      t_fr: "6. Fonctions",
      code: `def saluer(nom):\n  return f"Bonjour {nom}"`,
      d_fr: "Définissez des fonctions avec le mot-clé <code>def</code>.",
      t_en: "6. Functions",
      d_en: "Define reusable functions using the <code>def</code> keyword.",
      t_ar: "6. الدوال",
      d_ar: "تعريف دوال قابلة لإعادة الاستخدام باستخدام <code>def</code>."
    },
    {
      icon: "fa-rotate",
      t_fr: "7. Boucles (Loops)",
      code: `for fruit in fruits:\n  print(fruit)`,
      d_fr: "Parcourir des listes ou répéter des tâches avec <code>for</code> et <code>while</code>.",
      t_en: "7. Loops",
      d_en: "Iterate over lists or repeat tasks using <code>for</code> and <code>while</code>.",
      t_ar: "7. الحلقات التكرارية",
      d_ar: "التكرار عبر القوائم أو تنفيذ المهام بشكل متكرر."
    },
    {
      icon: "fa-dna",
      t_fr: "8. Classes & Objets",
      badge: "badge-pro",
      code: `class Robot:\n  def __init__(self, nom):\n    self.nom = nom`,
      d_fr: "Programmation Orientée Objet pour structurer vos projets.",
      t_en: "8. Classes & Objects",
      d_en: "Object-Oriented Programming to structure your projects.",
      t_ar: "8. الكلاسات والكائنات",
      d_ar: "البرمجة الكائنية لتنظيم مشاريعك."
    },
    {
      icon: "fa-box-open",
      t_fr: "9. Modules & Bibliothèques",
      code: `import math\nprint(math.sqrt(16))`,
      d_fr: "Utilisez la puissance des bibliothèques Python (math, random, requests).",
      t_en: "9. Modules & Libraries",
      d_en: "Leverage the power of Python's vast library ecosystem.",
      t_ar: "9. الوحدات والمكتبات",
      d_ar: "استفد من قوة مكتبات بايثون الضخمة."
    },
    {
      icon: "fa-check-double",
      t_fr: "10. Bonnes pratiques",
      d_fr: "Suivez le standard PEP 8 pour un code Pythonic et propre.",
      t_en: "10. Best Practices",
      d_en: "Follow PEP 8 standards for clean, Pythonic code.",
      t_ar: "10. أفضل الممارسات",
      d_ar: "اتبع معايير PEP 8 لكتابة كود نظيف."
    }
  ];

  const chaptersContainer = document.getElementById('pythonLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  pythonLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
