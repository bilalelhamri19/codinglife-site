<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Expert Engineering - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .lesson-card:hover {
      transform: translateX(10px);
      border-color: var(--cl-brand);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: rgba(55, 118, 171, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #3776ab;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-info p {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
      margin: 0;
    }
    @media (max-width: 768px) {
      .lesson-card {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #3776ab, #ffd343) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-python"></i> Python Expert Mastery</h1>
      <p>A focused curriculum of 20 high-density modules covering scripting, data science, and AI engineering.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-python"></i> إتقان بايثون للمحترفين</h1>
      <p>منهج مركز يضم 20 وحدة عالية الكثافة تغطي البرمجة، علوم البيانات، وهندسة الذكاء الاصطناعي.</p>
    </div>
  </div>

  <div class="chapters" id="pythonLessons">
    <!-- 20 UNIQUE LESSONS INJECTED VIA SCRIPT -->
  </div>
</div>

<script>
  const pythonLessons = [
    { t_en: "CPython Internals & Memory Management", icon: "fa-memory", t_ar: "خفايا CPython وإدارة الذاكرة", d_en: "CPython manages memory using reference counting and a cyclic garbage collector. We explore how Python allocates objects in the private heap and how the Global Interpreter Lock (GIL) affects thread execution and memory safety. Understanding these internals is essential for optimizing high-performance data scripts and preventing memory leaks in large-scale backend systems.", d_ar: "يدير CPython الذاكرة باستخدام عد المراجع وجامع المهملات الدوري. نستكشف كيف يخصص بايثون الكائنات في الـ heap الخاص وكيف يؤثر قفل المفسر العالمي (GIL) على تنفيذ الخيوط وسلامة الذاكرة. فهم هذه الخفايا ضروري لتحسين اسكربتات البيانات عالية الأداء ومنع تسريبات الذاكرة." },
    { t_en: "AsyncIO & Non-blocking Architecture", icon: "fa-bolt-lightning", t_ar: "معمارية AsyncIO والأنظمة غير المحظورة", d_en: "AsyncIO enables concurrent programming in Python using async/await syntax and an event loop. We delve into task scheduling and how to handle I/O-bound operations without blocking the main thread. This module teaches you how to build highly responsive networking tools and API servers that can handle thousands of simultaneous connections with minimal resource overhead.", d_ar: "تتيح AsyncIO البرمجة المتزامنة في بايثون باستخدام صيغة async/await وحلقة أحداث. نتعمق في جدولة المهام وكيفية التعامل مع عمليات الـ I/O دون حظر الخيط الرئيسي. يعلمك هذا القسم كيفية بناء أدوات شبكية وسيرفرات API مستجيبة للغاية يمكنها التعامل مع آلاف الاتصالات المتزامنة." },
    { t_en: "Metaprogramming & Custom Metaclasses", icon: "fa-code", t_ar: "البرمجة الوصفية والـ Metaclasses المخصصة", d_en: "Metaprogramming allows code to modify its own structure at runtime through metaclasses and decorators. We explore how to enforce API standards and automate repetitive tasks by creating 'classes of classes'. Mastering these advanced concepts empowers you to build sophisticated frameworks and libraries that provide clean and expressive interfaces for other developers.", d_ar: "تسمح البرمجة الوصفية للكود بتعديل هيكله الخاص أثناء التشغيل من خلال الـ metaclasses والـ decorators. نستكشف كيفية فرض معايير الـ API وأتمتة المهام المتكررة عن طريق إنشاء 'كلاسات الكلاسات'. إتقان هذه المفاهيم يمنحك القدرة على بناء أطر عمل ومكتبات متطورة توفر واجهات نظيفة ومعبرة." },
    { t_en: "Data Engineering with Vectorized NumPy", icon: "fa-table-list", t_ar: "هندسة البيانات باستخدام NumPy الموجه", d_en: "NumPy provides high-performance multidimensional arrays and vectorized operations that are essential for data science. We analyze how NumPy bypasses Python's slow loops by using contiguous memory blocks and optimized C routines. This module ensures you can process massive datasets with mathematical precision and speed, forming the foundation for modern machine learning pipelines.", d_ar: "يوفر NumPy مصفوفات متعددة الأبعاد عالية الأداء وعمليات موجهة ضرورية لعلوم البيانات. نقوم بتحليل كيف يتجاوز NumPy حلقات بايثون البطيئة باستخدام كتل ذاكرة متجاورة وروتينات C محسنة. يضمن هذا القسم قدرتك على معالجة مجموعات البيانات الضخمة بدقة رياضية وسرعة عالية." }
  ];

  const extraPython = [
    { t_en: "Deep Learning with PyTorch", t_ar: "التعلم العميق باستخدام PyTorch", icon: "fa-brain" },
    { t_en: "High-Performance APIs with FastAPI", t_ar: "APIs عالية الأداء بـ FastAPI", icon: "fa-rocket" },
    { t_en: "Network Automation & Scripting", t_ar: "أتمتة الشبكات والاسكربتات", icon: "fa-network-wired" },
    { t_en: "Unit Testing & Quality Assurance", t_ar: "اختبار الوحدات وضمان الجودة", icon: "fa-vial" },
    { t_en: "Web Scraping & Data Extraction", t_ar: "كشط الويب واستخراج البيانات", icon: "fa-robot" },
    { t_en: "Model Deployment & Cloud Ops", t_ar: "نشر النماذج والعمليات السحابية", icon: "fa-cloud-arrow-up" },
    { t_en: "Secure Coding & Secret Management", t_ar: "البرمجة الآمنة وإدارة الأسرار", icon: "fa-shield-check" },
    { t_en: "Advanced Functional Patterns", t_ar: "الأنماط الوظيفية المتقدمة", icon: "fa-gears" },
    { t_en: "Profiling & Performance Tuning", t_ar: "تحليل وتحسين الأداء", icon: "fa-gauge-high" },
    { t_en: "Maintaining Large Python Codebases", t_ar: "صيانة قواعد كود بايثون الضخمة", icon: "fa-building-columns" },
    { t_en: "Concurrency: Threading vs Processing", t_ar: "التزامن: الخيوط مقابل العمليات", icon: "fa-arrows-spin" },
    { t_en: "CLI Development with Click/Typer", t_ar: "تطوير واجهة الأوامر بـ Click", icon: "fa-terminal" },
    { t_en: "Database Integration Patterns", t_ar: "أنماط التكامل مع قواعد البيانات", icon: "fa-database" },
    { t_en: "Regular Expressions & Pattern Matching", t_ar: "التعبيرات النمطية ومطابقة الأنماط", icon: "fa-magnifying-glass" },
    { t_en: "The Future of Python Performance", t_ar: "مستقبل أداء لغة بايثون", icon: "fa-bolt" },
    { t_en: "Becoming a Senior Python Architect", t_ar: "كيف تصبح معماري بايثون أول", icon: "fa-award" }
  ];

  const chaptersContainer = document.getElementById('pythonLessons');
  
  pythonLessons.forEach(l => render(l));
  extraPython.forEach(l => render({
    icon: l.icon,
    t_en: l.t_en,
    t_ar: l.t_ar,
    d_en: `This specialized module on ${l.t_en} provides deep technical insights into professional Python engineering. We focus on real-world implementation strategies, clean code standards, and performance optimization for large-scale enterprise environments. By mastering ${l.t_en}, you ensure your Python solutions are robust, scalable, and meet the highest industry quality standards for automation and AI.`,
    d_ar: `توفر هذه الوحدة المتخصصة حول ${l.t_ar} رؤى تقنية عميقة في هندسة بايثون الاحترافية. نركز على استراتيجيات التنفيذ في العالم الحقيقي، معايير الكود النظيف، وتحسين الأداء لبيئات الشركات الضخمة. من خلال إتقان ${l.t_ar}، تضمن أن حلول بايثون الخاصة بك قوية وقابلة للتوسع وتلبي أعلى معايير الجودة في الصناعة.`
  }));

  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    div.innerHTML = `
      <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
      <div class="lesson-info">
        <div data-cl-lang="en">
          <h3>${lesson.t_en}</h3>
          <p>${lesson.d_en}</p>
        </div>
        <div data-cl-lang="ar">
          <h3>${lesson.t_ar}</h3>
          <p>${lesson.d_ar}</p>
        </div>
      </div>
    `;
    chaptersContainer.appendChild(div);
  }
</script>

<script src="site-polish.js"></script>
</body>
</html>
