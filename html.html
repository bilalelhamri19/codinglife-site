<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet HTML5 - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #e34f2622;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #e34f26;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #e34f26, #f06529) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-html5"></i> HTML5 Masterclass</h1>
      <p>Master the structural foundation of the modern web and technical SEO.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-html5"></i> احتراف HTML5</h1>
      <p>أتقن الهيكل الأساسي للويب الحديث وأساسيات السيو التقني.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-html5"></i> Masterclass HTML5</h1>
      <p>Maîtrisez les fondations structurelles du web moderne et le SEO technique.</p>
    </div>
  </div>

  <div class="chapters" id="htmlLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const htmlLessons = [
    {
      icon: "fa-info-circle",
      badge: "badge-modern",
      t_fr: "1. Qu'est-ce que HTML5 ?",
      d_fr: "HTML (HyperText Markup Language) est le langage de balisage utilisé pour créer la structure d'un site web.",
      t_en: "1. What is HTML5?",
      d_en: "HTML (HyperText Markup Language) is the standard markup language used to create the structure of web pages.",
      t_ar: "1. ما هو HTML5؟",
      d_ar: "HTML هي لغة توصيف النص الفائق المستخدمة لإنشاء هيكل صفحات الويب."
    },
    {
      icon: "fa-file-code",
      badge: "badge-important",
      t_fr: "2. Structure d'un Document",
      d_fr: "Chaque page commence par un doctype, suivi des balises html, head (pour les métadonnées) et body (pour le contenu).",
      code: "<!DOCTYPE html>\n<html>\n  <head>\n    <title>Ma Page</title>\n  </head>\n  <body>\n    <h1>Hello!</h1>\n  </body>\n</html>",
      t_en: "2. Document Structure",
      d_en: "Every page starts with a doctype, followed by html, head (for metadata), and body (for content) tags.",
      t_ar: "2. هيكل المستند",
      d_ar: "تبدأ كل صفحة بـ doctype، متبوعة بـ html و head و body."
    },
    {
      icon: "fa-heading",
      badge: "badge-modern",
      t_fr: "3. Titres et Paragraphes",
      d_fr: "Utilisez h1 à h6 pour les titres (important pour le SEO) et p pour le texte normal.",
      code: "<h1>Titre Principal</h1>\n<p>Ceci est un paragraphe.</p>",
      t_en: "3. Headings & Paragraphs",
      d_en: "Use h1 through h6 for titles (crucial for SEO) and p for regular text content.",
      t_ar: "3. العناوين والفقرات",
      d_ar: "استخدم h1 إلى h6 للعناوين و p للنصوص العادية."
    },
    {
      icon: "fa-link",
      badge: "badge-pro",
      t_fr: "4. Liens et Navigation",
      d_fr: "La balise 'a' (anchor) permet de naviguer entre les pages en utilisant l'attribut href.",
      code: "<a href='https://google.com'>Visitez Google</a>",
      t_en: "4. Links & Navigation",
      d_en: "The 'a' (anchor) tag allows navigation between pages using the href attribute.",
      t_ar: "4. الروابط والتنقل",
      d_ar: "تسمح علامة 'a' بالتنقل بين الصفحات باستخدام href."
    },
    {
      icon: "fa-image",
      badge: "badge-modern",
      t_fr: "5. Images et Médias",
      d_fr: "Insérez des images avec 'img' et n'oubliez pas l'attribut 'alt' pour l'accessibilité.",
      code: "<img src='image.jpg' alt='Description de l\'image'>",
      t_en: "5. Images & Media",
      d_en: "Insert images using the 'img' tag, and always include the 'alt' attribute for accessibility.",
      t_ar: "5. الصور والوسائط",
      d_ar: "أدرج الصور باستخدام 'img' ولا تنسَ alt للوصول الشامل."
    },
    {
      icon: "fa-list-ul",
      badge: "badge-modern",
      t_fr: "6. Listes",
      d_fr: "Listes à puces (ul) ou ordonnées (ol) utilisant des éléments li.",
      code: "<ul>\n  <li>Élément 1</li>\n  <li>Élément 2</li>\n</ul>",
      t_en: "6. Lists",
      d_en: "Unordered lists (ul) or ordered lists (ol) using li elements for each item.",
      t_ar: "6. القوائم",
      d_ar: "قوائم غير مرتبة (ul) أو مرتبة (ol) باستخدام عناصر li."
    },
    {
      icon: "fa-table",
      badge: "badge-pro",
      t_fr: "7. Tableaux",
      d_fr: "Organisez vos données tabulaires avec table, tr (ligne), th (en-tête) et td (cellule).",
      code: "<table>\n  <tr><th>Nom</th></tr>\n  <tr><td>Ali</td></tr>\n</table>",
      t_en: "7. Tables",
      d_en: "Organize tabular data with table, tr (row), th (header), and td (cell) tags.",
      t_ar: "7. الجداول",
      d_ar: "نظم بياناتك في جداول باستخدام tr و th و td."
    },
    {
      icon: "fa-wpforms",
      badge: "badge-important",
      t_fr: "8. Formulaires",
      d_fr: "Collectez les données utilisateur avec input, textarea, select et button.",
      code: "<input type='text' placeholder='Nom'>\n<button>Envoyer</button>",
      t_en: "8. Forms",
      d_en: "Collect user input using input, textarea, select, and button elements.",
      t_ar: "8. النماذج",
      d_ar: "اجمع بيانات المستخدم باستخدام input و textarea و button."
    },
    {
      icon: "fa-puzzle-piece",
      badge: "badge-important",
      t_fr: "9. HTML Sémantique",
      d_fr: "Utilisez des balises qui ont du sens : header, footer, nav, section, article.",
      t_en: "9. Semantic HTML",
      d_en: "Use meaningful tags: header, footer, nav, section, and article for better structure.",
      t_ar: "9. HTML الدلالي",
      d_ar: "استخدم علامات لها معنى مثل header و footer و nav."
    },
    {
      icon: "fa-universal-access",
      badge: "badge-pro",
      t_fr: "10. Accessibilité et SEO",
      d_fr: "Apprenez les attributs ARIA et les bonnes pratiques pour que votre site soit accessible à tous.",
      t_en: "10. Accessibility & SEO",
      d_en: "Learn ARIA attributes and best practices to make your site accessible and search-engine friendly.",
      t_ar: "10. الوصول والسيو",
      d_ar: "تعلم سمات ARIA وأفضل الممارسات لجعل موقعك متاحاً للجميع."
    }
  ];

  const chaptersContainer = document.getElementById('htmlLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  htmlLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
