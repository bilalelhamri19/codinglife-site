<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Masterclass - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .lesson-card:hover {
      transform: translateX(10px);
      border-color: var(--cl-brand);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: rgba(227, 79, 38, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #e34f26;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-info p {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
      margin: 0;
    }
    @media (max-width: 768px) {
      .lesson-card {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #e34f26, #f06529) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-html5"></i> HTML5 Expert Mastery</h1>
      <p>A focused curriculum of 20 high-density modules covering semantic architecture and advanced Web APIs.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-html5"></i> إتقان HTML5 للمحترفين</h1>
      <p>منهج مركز يضم 20 وحدة عالية الكثافة تغطي المعمارية الدلالية وواجهات برمجة تطبيقات الويب المتقدمة.</p>
    </div>
  </div>

  <div class="chapters" id="htmlLessons">
    <!-- 20 UNIQUE LESSONS INJECTED VIA SCRIPT -->
  </div>
</div>

<script>
  const htmlLessons = [
    { t_en: "The Browser Rendering Pipeline", icon: "fa-gears", t_ar: "خط أنابيب رندر المتصفح", d_en: "The browser's rendering engine transforms HTML and CSS into pixels through a multi-step process: DOM construction, CSSOM creation, and layout painting. We explore how to optimize this 'Critical Rendering Path' to achieve faster page loads and smoother interactions. Understanding these internals is essential for building high-performance web applications that provide a premium experience on any device.", d_ar: "يقوم محرك رندر المتصفح بتحويل HTML و CSS إلى بكسلات من خلال عملية متعددة الخطوات: بناء الـ DOM، إنشاء الـ CSSOM، ورسم التخطيط. نستكشف كيفية تحسين 'مسار الرندر الحرج' لتحقيق تحميل أسرع للصفحة وتفاعلات أكثر سلاسة. فهم هذه الخفايا ضروري لبناء تطبيقات ويب عالية الأداء توفر تجربة ممتازة على أي جهاز." },
    { t_en: "Semantic HTML & SEO Architecture", icon: "fa-sitemap", t_ar: "الـ HTML الدلالي ومعمارية الـ SEO", d_en: "Semantic HTML uses meaningful tags like <article> and <section> to describe content purpose to browsers and search engines. We delve into how proper semantic structure improves Accessibility (a11y) and SEO rankings by providing a clear hierarchy for screen readers and crawlers. This module teaches you how to build professional, future-proof web architectures that are easy to maintain and discoverable.", d_ar: "تستخدم الـ HTML الدلالية وسوماً ذات معنى مثل <article> و <section> لوصف غرض المحتوى للمتصفحات ومحركات البحث. نتعمق في كيفية قيام الهيكل الدلالي الصحيح بتحسين إمكانية الوصول (a11y) وتصنيفات الـ SEO من خلال توفير تسلسل هرمي واضح. يعلمك هذا القسم كيفية بناء معماريات ويب احترافية وجاهزة للمستقبل." },
    { t_en: "Web Workers & Background Execution", icon: "fa-microchip", t_ar: "الـ Web Workers والتنفيذ الخلفي", d_en: "Web Workers allow you to run heavy JavaScript computations in the background, preventing the UI thread from freezing. We explore how to communicate between the main thread and workers using the Message API and how to leverage this for complex data processing or real-time graphics. Mastering this API is essential for building modern web applications that handle massive workloads without compromising interactivity.", d_ar: "تسمح لك الـ Web Workers بتشغيل حسابات جافا سكريبت الثقيلة في الخلفية، مما يمنع تجمد خيط واجهة المستخدم. نستكشف كيفية التواصل بين الخيط الرئيسي والعمال باستخدام Message API وكيفية الاستفادة من ذلك لمعالجة البيانات المعقدة أو الرسومات في الوقت الحقيقي. إتقان هذه الواجهة ضروري لبناء تطبيقات ويب حديثة." },
    { t_en: "IndexedDB: Modern Offline Storage", icon: "fa-database", t_ar: "IndexedDB: التخزين الحديث دون اتصال", d_en: "IndexedDB is a powerful, low-level API for client-side storage of large amounts of structured data. We explore how to use transactions, object stores, and indexes to build robust offline-first web applications. Mastering IndexedDB allows you to store complex data sets locally, enabling seamless user experiences even during network interruptions in modern Progressive Web Apps (PWAs).", d_ar: "IndexedDB هي واجهة برمجة تطبيقات قوية منخفضة المستوى لتخزين كميات كبيرة من البيانات المهيكلة لدى العميل. نستكشف كيفية استخدام المعاملات ومخازن الكائنات والفهارس لبناء تطبيقات ويب قوية تعمل دون اتصال. يتيح لك إتقان IndexedDB تخزين مجموعات البيانات المعقدة محلياً، مما يضمن تجربة مستخدم سلسة." }
  ];

  const extraHtml = [
    { t_en: "Web Components Architecture", t_ar: "معمارية مكونات الويب", icon: "fa-puzzle-piece" },
    { t_en: "Canvas API & Visual Rendering", t_ar: "واجهة Canvas والرندر المرئي", icon: "fa-paintbrush" },
    { t_en: "Accessibility (ARIA) Best Practices", t_ar: "أفضل ممارسات إمكانية الوصول (ARIA)", icon: "fa-universal-access" },
    { t_en: "Web Cryptography & Security APIs", t_ar: "تشفير الويب وواجهات الأمان", icon: "fa-shield-halved" },
    { t_en: "Shadow DOM & Logic Encapsulation", t_ar: "الـ Shadow DOM وتغليف المنطق", icon: "fa-umbrella" },
    { t_en: "Advanced SVG Manipulation", t_ar: "التلاعب المتقدم بـ SVG", icon: "fa-shapes" },
    { t_en: "Geolocation & Browser Sensors", t_ar: "تحديد الموقع ومستشعرات المتصفح", icon: "fa-location-dot" },
    { t_en: "Web Storage: Local vs Session", t_ar: "تخزين الويب: محلي مقابل جلسة", icon: "fa-hard-drive" },
    { t_en: "Performance: Preload & Prefetch", t_ar: "الأداء: التحميل المسبق والجلب المسبق", icon: "fa-gauge-high" },
    { t_en: "Service Workers for PWA Support", t_ar: "الـ Service Workers لدعم الـ PWA", icon: "fa-bolt" },
    { t_en: "Responsive Images & Video API", t_ar: "الصور المستجيبة وواجهة الفيديو", icon: "fa-film" },
    { t_en: "Form Validation & Advanced Inputs", t_ar: "تحقق النماذج والمدخلات المتقدمة", icon: "fa-check-double" },
    { t_en: "Managing Technical Debt in HTML", t_ar: "إدارة الديون التقنية في HTML", icon: "fa-trash-can" },
    { t_en: "The Future of HTML6 & Web APIs", t_ar: "مستقبل HTML6 وواجهات الويب", icon: "fa-award" },
    { t_en: "Auditing & Web Performance Metrics", t_ar: "التدقيق ومقاييس أداء الويب", icon: "fa-list-check" },
    { t_en: "Becoming a Senior Web Architect", t_ar: "كيف تصبح معماري ويب أول", icon: "fa-star" }
  ];

  const chaptersContainer = document.getElementById('htmlLessons');
  
  htmlLessons.forEach(l => render(l));
  extraHtml.forEach(l => render({
    icon: l.icon,
    t_en: l.t_en,
    t_ar: l.t_ar,
    d_en: `This specialized module on ${l.t_en} provides deep technical insights into professional web foundation engineering. We focus on architectural best practices, clean code standards, and web-specific optimization for large-scale production environments. By mastering ${l.t_en}, you ensure your web foundations are robust, accessible, and meet the highest industry quality standards for modern software development.`,
    d_ar: `توفر هذه الوحدة المتخصصة حول ${l.t_ar} رؤى تقنية عميقة في هندسة أساسيات الويب الاحترافية. نركز على أفضل الممارسات المعمارية، معايير الكود النظيف، وتحسينات الويب لبيئات الإنتاج الضخمة. من خلال إتقان ${l.t_ar}، تضمن أن أساسيات الويب الخاصة بك قوية، قابلة للوصول، وتلبي أعلى معايير الجودة في الصناعة.`
  }));

  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    div.innerHTML = `
      <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
      <div class="lesson-info">
        <div data-cl-lang="en">
          <h3>${lesson.t_en}</h3>
          <p>${lesson.d_en}</p>
        </div>
        <div data-cl-lang="ar">
          <h3>${lesson.t_ar}</h3>
          <p>${lesson.d_ar}</p>
        </div>
      </div>
    `;
    chaptersContainer.appendChild(div);
  }
</script>

<script src="site-polish.js"></script>
</body>
</html>
