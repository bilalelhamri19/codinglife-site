<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet Java - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #ed8b0022;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #ed8b00;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #ed8b00, #5382a1) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-java"></i> Java Enterprise Mastery</h1>
      <p>Build robust, scalable, and secure enterprise applications with Java.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-java"></i> إتقان Java</h1>
      <p>بناء تطبيقات مؤسسية قوية وقابلة للتوسع وآمنة باستخدام جافا.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-java"></i> Maîtrise Java</h1>
      <p>Créez des applications d'entreprise robustes, évolutives et sécurisées.</p>
    </div>
  </div>

  <div class="chapters" id="javaLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const javaLessons = [
    {
      icon: "fa-question-circle",
      badge: "badge-modern",
      t_fr: "1. Qu'est-ce que Java ?",
      d_fr: "Java est un langage multi-plateforme ('Write Once, Run Anywhere') créé par Sun Microsystems. Il est orienté objet, robuste et très utilisé dans les grandes entreprises et les applications Android.",
      t_en: "1. What is Java?",
      d_en: "Java is a multi-platform language ('Write Once, Run Anywhere') created by Sun Microsystems. It is object-oriented, robust, and widely used in enterprise and Android development.",
      t_ar: "1. ما هو Java؟",
      d_ar: "جافا هي لغة برمجة متعددة المنصات ('اكتب مرة واحدة، وشغل في أي مكان') تم إنشاؤها من قبل Sun Microsystems. هي لغة كائنية التوجه، قوية وتستخدم على نطاق واسع في الشركات وتطوير أندرويد."
    },
    {
      icon: "fa-download",
      badge: "badge-important",
      t_fr: "2. Installation & Premier Programme",
      d_fr: "Installez le JDK (17 ou 21), configurez le PATH, et créez votre premier 'Hello World'. Utilisez IntelliJ IDEA pour la meilleure expérience.",
      code: "public class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"Bonjour le monde ! 👋\");\n    }\n}",
      t_en: "2. Installation & First Program",
      d_en: "Install the JDK (17 or 21), configure the PATH, and create your first 'Hello World'. Use IntelliJ IDEA for the best experience.",
      t_ar: "2. التثبيت وأول برنامج",
      d_ar: "قم بتثبيت JDK (17 أو 21)، وتهيئة المسار (PATH)، وأنشئ برنامجك الأول 'Hello World'. استخدم IntelliJ IDEA للحصول على أفضل تجربة."
    },
    {
      icon: "fa-vial",
      badge: "badge-modern",
      t_fr: "3. Variables et Types de Données",
      d_fr: "Apprenez les types primitifs (int, double, char, boolean) et les objets (String). Java 10+ permet l'utilisation de 'var' pour l'inférence de type.",
      code: "int age = 25;\ndouble prix = 9.99;\nString nom = \"Mohammed\";\nvar score = 100; // Java devine le type",
      t_en: "3. Variables and Data Types",
      d_en: "Learn primitive types (int, double, char, boolean) and objects (String). Java 10+ allows using 'var' for type inference.",
      t_ar: "3. المتغيرات وأنواع البيانات",
      d_ar: "تعلم الأنواع الأساسية (int, double, char, boolean) والكائنات (String). يسمح Java 10+ باستخدام 'var' لاستنتاج النوع."
    },
    {
      icon: "fa-code-branch",
      badge: "badge-modern",
      t_fr: "4. Opérateurs et Conditions",
      d_fr: "Maîtrisez les calculs et la logique. Utilisez if, else if, et le nouveau switch moderne de Java 14+.",
      code: "if (note >= 16) {\n    System.out.println(\"Très Bien\");\n}\n\nString jour = switch (n) {\n    case 1 -> \"Lundi\";\n    default -> \"Autre\";\n};",
      t_en: "4. Operators and Conditions",
      d_en: "Master calculations and logic. Use if, else if, and the modern switch introduced in Java 14+.",
      t_ar: "4. العمليات والشروط",
      d_ar: "أتقن الحسابات والمنطق. استخدم if، else if، و switch الحديث المتوفر منذ Java 14+."
    },
    {
      icon: "fa-sync",
      badge: "badge-modern",
      t_fr: "5. Boucles et Tableaux",
      d_fr: "Utilisez for, while, et for-each pour parcourir des données. Gérez des tableaux simples ou multidimensionnels (matrices).",
      code: "int[] nombres = {1, 2, 3};\nfor (int n : nombres) {\n    System.out.println(n);\n}",
      t_en: "5. Loops and Arrays",
      d_en: "Use for, while, and for-each to iterate through data. Manage simple or multi-dimensional arrays (matrices).",
      t_ar: "5. الحلقات والمصفوفات",
      d_ar: "استخدم for، while، و for-each للمرور عبر البيانات. تعامل مع المصفوفات البسيطة أو متعددة الأبعاد."
    },
    {
      icon: "fa-tools",
      badge: "badge-pro",
      t_fr: "6. Méthodes (Fonctions)",
      d_fr: "Créez des blocs de code réutilisables. Apprenez la surcharge de méthodes (Overloading) pour avoir le même nom avec des paramètres différents.",
      code: "public static int addition(int a, int b) {\n    return a + b;\n}",
      t_en: "6. Methods (Functions)",
      d_en: "Create reusable blocks of code. Learn method overloading to have the same name with different parameters.",
      t_ar: "6. الدوال (Methods)",
      d_ar: "أنشئ كتل برمجية قابلة لإعادة الاستخدام. تعلم تحميل الدوال الزائد (Overloading) لاستخدام نفس الاسم ببارامترات مختلفة."
    },
    {
      icon: "fa-dna",
      badge: "badge-important",
      t_fr: "7. POO — Le Cœur de Java",
      d_fr: "Maîtrisez les 4 piliers : Encapsulation (private/getters), Héritage (extends), Polymorphisme et Abstraction (abstract/interface).",
      code: "public class Chien extends Animal {\n    @Override\n    public void faireBruit() { System.out.println(\"Waf!\"); }\n}",
      t_en: "7. OOP — The Core of Java",
      d_en: "Master the 4 pillars: Encapsulation (private/getters), Inheritance (extends), Polymorphism, and Abstraction (abstract/interface).",
      t_ar: "7. البرمجة كائنية التوجه (POO)",
      d_ar: "أتقن الركائز الأربعة: التغليف (Encapsulation)، الوراثة (Inheritance)، تعدد الأشكال (Polymorphism)، والتجريد (Abstraction)."
    },
    {
      icon: "fa-layer-group",
      badge: "badge-pro",
      t_fr: "8. Collections (ArrayList & HashMap)",
      d_fr: "Gérez des listes de données dynamiques avec ArrayList et des paires clé-valeur avec HashMap.",
      code: "ArrayList<String> liste = new ArrayList<>();\nHashMap<String, Integer> map = new HashMap<>();",
      t_en: "8. Collections (ArrayList & HashMap)",
      d_en: "Manage dynamic data lists with ArrayList and key-value pairs with HashMap.",
      t_ar: "8. المجموعات (Collections)",
      d_ar: "تعامل مع قوائم البيانات الديناميكية باستخدام ArrayList وأزواج المفتاح والقيمة باستخدام HashMap."
    },
    {
      icon: "fa-exclamation-triangle",
      badge: "badge-important",
      t_fr: "9. Gestion des Exceptions",
      d_fr: "Utilisez try, catch, et finally pour gérer les erreurs et éviter que votre application ne plante.",
      code: "try {\n    int res = 10 / 0;\n} catch (ArithmeticException e) {\n    System.out.println(\"Erreur !\");\n}",
      t_en: "9. Exception Handling",
      d_en: "Use try, catch, and finally to handle errors and prevent your application from crashing.",
      t_ar: "9. معالجة الاستثناءات",
      d_ar: "استخدم try، catch، و finally للتعامل مع الأخطاء ومنع تطبيقك من التوقف المفاجئ."
    },
    {
      icon: "fa-bolt",
      badge: "badge-pro",
      t_fr: "10. Java Moderne (Lambda & Stream)",
      d_fr: "Utilisez les expressions Lambda (Java 8+) et l'API Stream pour manipuler les données de manière élégante et concise.",
      code: "noms.stream()\n    .filter(n -> n.startsWith(\"A\"))\n    .forEach(System.out::println);",
      t_en: "10. Modern Java (Lambda & Stream)",
      d_en: "Use Lambda expressions (Java 8+) and the Stream API to manipulate data elegantly and concisely.",
      t_ar: "10. جافا الحديثة (Lambda & Stream)",
      d_ar: "استخدم تعبيرات Lambda و Stream API للتعامل مع البيانات بطريقة أنيقة ومختصرة."
    },
    {
      icon: "fa-road",
      badge: "badge-modern",
      t_fr: "11. Feuille de Route Java",
      d_fr: "Le chemin vers l'expertise : Syntaxe -> POO -> Collections -> API Stream -> Spring Boot -> Microservices.",
      t_en: "11. Java Roadmap",
      d_en: "The path to expertise: Syntax -> OOP -> Collections -> Stream API -> Spring Boot -> Microservices.",
      t_ar: "11. خارطة طريق Java",
      d_ar: "طريق الاحتراف: الأساسيات -> POO -> المجموعات -> Stream API -> Spring Boot -> Microservices."
    }
  ];

  const chaptersContainer = document.getElementById('javaLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  javaLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
