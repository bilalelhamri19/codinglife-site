<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet Java - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #ed8b0022;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #ed8b00;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #ed8b00, #5382a1) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-java"></i> Java Enterprise Mastery</h1>
      <p>Build robust, scalable, and secure enterprise applications with Java.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-java"></i> إتقان Java</h1>
      <p>بناء تطبيقات مؤسسية قوية وقابلة للتوسع وآمنة باستخدام جافا.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-java"></i> Maîtrise Java</h1>
      <p>Créez des applications d'entreprise robustes, évolutives et sécurisées.</p>
    </div>
  </div>

  <div class="chapters" id="javaLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const javaLessons = [
    {
      icon: "fa-rocket",
      t_fr: "1. Pourquoi Java ?",
      d_fr: "Java est l'un des langages les plus populaires au monde, connu pour sa devise 'Write Once, Run Anywhere'.",
      t_en: "1. Why Java?",
      d_en: "Java is one of the most popular languages, known for its 'Write Once, Run Anywhere' philosophy.",
      t_ar: "1. لماذا جافا؟",
      d_ar: "جافا هي واحدة من أكثر اللغات شعبية، وتشتهر بشعار 'اكتب مرة واحدة، وشغل في أي مكان'."
    },
    {
      icon: "fa-code",
      t_fr: "2. Syntaxe de base",
      code: `public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello");\n  }\n}`,
      d_fr: "Tout code Java doit être à l'intérieur d'une classe.",
      t_en: "2. Basic Syntax",
      d_en: "All Java code must be inside a class structure.",
      t_ar: "2. الأساسيات",
      d_ar: "كل كود جافا يجب أن يكون داخل كلاس."
    },
    {
      icon: "fa-vial",
      t_fr: "3. Variables & Types",
      code: `int age = 25;\nString nom = "Ali";\ndouble pi = 3.14;`,
      d_fr: "Java est un langage fortement typé. Vous devez déclarer le type de chaque variable.",
      t_en: "3. Variables & Types",
      d_en: "Java is strongly typed. You must declare the type of every variable.",
      t_ar: "3. المتغيرات والأنواع",
      d_ar: "جافا لغة صارمة في أنواع البيانات، يجب تحديد نوع كل متغير."
    },
    {
      icon: "fa-dna",
      t_fr: "4. POO (Classes & Objets)",
      badge: "badge-important",
      code: `User user = new User();\nuser.setNom("Ali");`,
      d_fr: "Java est centré sur les objets. Apprenez à créer des classes et à instancier des objets.",
      t_en: "4. OOP (Classes & Objects)",
      d_en: "Java is object-centric. Learn to create classes and instantiate objects.",
      t_ar: "4. البرمجة الكائنية",
      d_ar: "جافا تعتمد على الكائنات بشكل كامل."
    },
    {
      icon: "fa-shield",
      t_fr: "5. Encapsulation",
      badge: "badge-pro",
      code: `private String secret;\npublic String getSecret() { return secret; }`,
      d_fr: "Protégez vos données en utilisant les modificateurs d'accès (private, public).",
      t_en: "5. Encapsulation",
      d_en: "Protect your data using access modifiers like private and public.",
      t_ar: "5. التغليف",
      d_ar: "حماية بياناتك باستخدام مغيرات الوصول."
    },
    {
      icon: "fa-list",
      t_fr: "6. Collections (ArrayList)",
      code: `ArrayList<String> liste = new ArrayList<>();\nliste.add("Java");`,
      d_fr: "Utilisez le framework Collections pour gérer des listes de données dynamiques.",
      t_en: "6. Collections (ArrayList)",
      d_en: "Use the Collections framework to manage dynamic lists of data.",
      t_ar: "6. المجموعات",
      d_ar: "استخدام إطار عمل المجموعات لإدارة البيانات الديناميكية."
    },
    {
      icon: "fa-triangle-exclamation",
      t_fr: "7. Gestion des Exceptions",
      code: `try {\n  // code\n} catch (Exception e) { ... }`,
      d_fr: "Gérez les erreurs proprement avec try, catch et finally.",
      t_en: "7. Exception Handling",
      d_en: "Handle errors gracefully using try, catch, and finally blocks.",
      t_ar: "7. معالجة الاستثناءات",
      d_ar: "التعامل مع الأخطاء بشكل احترافي."
    }
  ];

  const chaptersContainer = document.getElementById('javaLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  javaLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
