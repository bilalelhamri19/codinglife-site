<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet C# - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #68217a22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #68217a;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #68217a, #a855f7) !important;">
    <div data-cl-lang="en">
      <h1><i class="fas fa-hashtag"></i> C# & .NET Mastery</h1>
      <p>Build enterprise applications, Windows software, and immersive games with Unity.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fas fa-hashtag"></i> إتقان C# و .NET</h1>
      <p>ابنِ تطبيقات المؤسسات، برمجيات ويندوز، والألعاب المذهلة باستخدام Unity.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fas fa-hashtag"></i> Maîtrise C# et .NET</h1>
      <p>Développez des applications d'entreprise, des logiciels Windows et des jeux Unity.</p>
    </div>
  </div>

  <div class="chapters" id="csharpLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const csharpLessons = [
    {
      icon: "fa-info-circle",
      badge: "badge-modern",
      t_fr: "1. Introduction au C#",
      d_fr: "C# est un langage moderne et puissant développé par Microsoft, fonctionnant sur le framework .NET.",
      t_en: "1. Intro to C#",
      d_en: "C# is a modern, powerful language developed by Microsoft, running on the .NET framework.",
      t_ar: "1. مقدمة في C#",
      d_ar: "C# هي لغة حديثة وقوية طورتها مايكروسوفت، تعمل على إطار عمل .NET."
    },
    {
      icon: "fa-code",
      badge: "badge-important",
      t_fr: "2. Syntaxe et Types",
      d_fr: "C# est fortement typé. Types communs : int, string, bool, double.",
      code: "string nom = \"Ali\";\nint age = 30;\nbool estDev = true;",
      t_en: "2. Syntax & Types",
      d_en: "C# is strongly typed. Common types include string, int, bool, and double.",
      t_ar: "2. الأساسيات والأنواع",
      d_ar: "C# لغة صارمة في أنواع البيانات. الأنواع الشائعة: نصوص، أرقام، وقيم منطقية."
    },
    {
      icon: "fa-code-branch",
      badge: "badge-modern",
      t_fr: "3. Conditions et Logique",
      d_fr: "Utilisez if, else et switch pour contrôler le flux.",
      code: "if (age >= 18) {\n    Console.WriteLine(\"Adulte\");\n}",
      t_en: "3. Logic & Conditions",
      d_en: "Control your program flow using if statements, else branches, and switch cases.",
      t_ar: "3. المنطق والشروط",
      d_ar: "تحكم في تدفق البرنامج باستخدام if و else و switch."
    },
    {
      icon: "fa-sync",
      badge: "badge-modern",
      t_fr: "4. Boucles",
      d_fr: "Répétez des actions avec for, while et foreach pour les listes.",
      code: "foreach (var item in items) {\n    Console.WriteLine(item);\n}",
      t_en: "4. Loops",
      d_en: "Iterate through collections and repeat actions with for, while, and foreach loops.",
      t_ar: "4. الحلقات",
      d_ar: "كرر الأفعال باستخدام الحلقات مثل for و foreach للمجموعات."
    },
    {
      icon: "fa-cube",
      badge: "badge-important",
      t_fr: "5. Classes et Objets",
      d_fr: "C# est 100% orienté objet. Tout est basé sur des classes.",
      code: "public class Person {\n    public string Name { get; set; }\n}",
      t_en: "5. Classes & Objects",
      d_en: "C# is purely object-oriented. Learn how to define classes, properties, and methods.",
      t_ar: "5. الكلاسات والكائنات",
      d_ar: "C# لغة كائنية التوجه بالكامل. كل شيء يعتمد على الكلاسات."
    },
    {
      icon: "fa-dna",
      badge: "badge-pro",
      t_fr: "6. Héritage et Polymorphisme",
      d_fr: "Réutilisez le code avec l'héritage et surchargez les méthodes.",
      code: "public class Student : Person { }",
      t_en: "6. Inheritance & Polymorphism",
      d_en: "Reuse code through inheritance and implement polymorphism using virtual and override keywords.",
      t_ar: "6. الوراثة وتعدد الأشكال",
      d_ar: "أعد استخدام الكود عبر الوراثة وطبق تعدد الأشكال."
    },
    {
      icon: "fa-layer-group",
      badge: "badge-pro",
      t_fr: "7. LINQ",
      d_fr: "Interrogez vos collections de données de manière simple et puissante.",
      code: "var list = items.Where(x => x.Active).ToList();",
      t_en: "7. LINQ",
      d_en: "Query your data collections easily using Language Integrated Query (LINQ).",
      t_ar: "7. تقنية LINQ",
      d_ar: "استعلم عن مجموعات البيانات بسهولة وقوة باستخدام LINQ."
    },
    {
      icon: "fa-bolt",
      badge: "badge-pro",
      t_fr: "8. Programmation Asynchrone",
      d_fr: "Améliorez les performances avec async et await.",
      code: "public async Task GetData() { await ... }",
      t_en: "8. Async Programming",
      d_en: "Improve application responsiveness and performance using async and await tasks.",
      t_ar: "8. البرمجة غير المتزامنة",
      d_ar: "حسن أداء تطبيقاتك باستخدام البرمجة غير المتزامنة."
    },
    {
      icon: "fa-gamepad",
      badge: "badge-pro",
      t_fr: "9. C# pour Unity",
      d_fr: "Apprenez à scripter des comportements d'objets dans le moteur de jeu Unity.",
      code: "void Update() {\n    transform.Rotate(0, 10, 0);\n}",
      t_en: "9. C# for Unity",
      d_en: "Learn how to script game behaviors and logic within the Unity game engine.",
      t_ar: "9. C# لـ Unity",
      d_ar: "تعلم برمجة سلوكيات الكائنات في محرك الألعاب Unity."
    },
    {
      icon: "fa-server",
      badge: "badge-pro",
      t_fr: "10. ASP.NET Core",
      d_fr: "Créez des APIs web et des sites dynamiques avec le framework ASP.NET moderne.",
      t_en: "10. ASP.NET Core",
      d_en: "Build robust web APIs and dynamic web applications with modern ASP.NET Core.",
      t_ar: "10. ASP.NET Core",
      d_ar: "أنشئ واجهات برمجية للويب وتطبيقات ديناميكية باستخدام ASP.NET Core."
    }
  ];

  const chaptersContainer = document.getElementById('csharpLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  csharpLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
