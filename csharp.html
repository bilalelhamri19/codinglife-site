<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet C# - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #a179dc22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #a179dc;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #a179dc, #68217a) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-microsoft"></i> C# & .NET Mastery</h1>
      <p>Build powerful desktop, web, and game applications with C# and the .NET framework.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-microsoft"></i> إتقان C#</h1>
      <p>بناء تطبيقات سطح مكتب وويب وألعاب قوية باستخدام C# وإطار عمل .NET.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-microsoft"></i> Maîtrise C#</h1>
      <p>Créez des applications bureau, web et jeux puissantes avec C# et .NET.</p>
    </div>
  </div>

  <div class="chapters" id="csharpLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const csharpLessons = [
    {
      icon: "fa-rocket",
      t_fr: "1. Qu’est-ce que C# ?",
      d_fr: "C# est un langage moderne et puissant développé par Microsoft, idéal pour le développement .NET et Unity.",
      t_en: "1. What is C#?",
      d_en: "C# is a modern, powerful language developed by Microsoft, ideal for .NET and Unity development.",
      t_ar: "1. ما هو C#؟",
      d_ar: "C# هي لغة حديثة وقوية طورتها مايكروسوفت، مثالية لتطوير .NET وألعاب Unity."
    },
    {
      icon: "fa-code",
      t_fr: "2. Syntaxe de base",
      code: `using System;\nclass Program {\n  static void Main() {\n    Console.WriteLine("Hello");\n  }\n}`,
      d_fr: "C# utilise une syntaxe proche du C++ et Java, avec une structure orientée objet.",
      t_en: "2. Basic Syntax",
      d_en: "C# uses a syntax close to C++ and Java, with a strong object-oriented structure.",
      t_ar: "2. الأساسيات",
      d_ar: "تستخدم C# بناء جملة قريباً من C++ وجافا."
    },
    {
      icon: "fa-vial",
      t_fr: "3. Variables & Types",
      code: `int score = 100;\nstring nom = "Ali";\nbool isReady = true;`,
      d_fr: "C# est un langage à typage fort, garantissant la sécurité du code.",
      t_en: "3. Variables & Types",
      d_en: "C# is a strongly typed language, ensuring code safety and robustness.",
      t_ar: "3. المتغيرات والأنواع",
      d_ar: "C# لغة صارمة في أنواع البيانات لضمان قوة الكود."
    },
    {
      icon: "fa-dna",
      t_fr: "4. POO & Classes",
      badge: "badge-important",
      code: `class Player {\n  public string Name { get; set; }\n}`,
      d_fr: "Maîtrisez les classes, les objets et les propriétés pour structurer vos apps.",
      t_en: "4. OOP & Classes",
      d_en: "Master classes, objects, and properties to structure your applications.",
      t_ar: "4. البرمجة الكائنية",
      d_ar: "إتقان الكلاسات والكائنات لتنظيم تطبيقاتك."
    },
    {
      icon: "fa-gamepad",
      t_fr: "5. C# pour Unity",
      badge: "badge-pro",
      d_fr: "Apprenez les bases du scripting pour le développement de jeux vidéo.",
      t_en: "5. C# for Unity",
      d_en: "Learn the basics of scripting for game development in Unity.",
      t_ar: "5. C# لبرمجة الألعاب",
      d_ar: "تعلم أساسيات البرمجة لتطوير الألعاب في Unity."
    }
  ];

  const chaptersContainer = document.getElementById('csharpLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  csharpLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
