<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet Git - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #f0503222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #f05032;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #f05032, #c0392b) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-git-alt"></i> Git Version Control</h1>
      <p>Master version control and collaboration to manage your code professionally.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-git-alt"></i> إتقان Git</h1>
      <p>احترف التحكم في الإصدارات والتعاون لإدارة الكود الخاص بك بشكل احترافي.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-git-alt"></i> Maîtrise Git</h1>
      <p>Maîtrisez le contrôle de version et la collaboration pour gérer votre code.</p>
    </div>
  </div>

  <div class="chapters" id="gitLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const gitLessons = [
    {
      icon: "fa-rocket",
      t_fr: "1. Qu’est-ce que Git ?",
      d_fr: "Git est un système de contrôle de version décentralisé qui permet de suivre l'historique de votre code.",
      t_en: "1. What is Git?",
      d_en: "Git is a decentralized version control system used to track code history and changes.",
      t_ar: "1. ما هو Git؟",
      d_ar: "Git هو نظام لا مركزي للتحكم في الإصدارات يُستخدم لتتبع تاريخ الكود."
    },
    {
      icon: "fa-folder-plus",
      t_fr: "2. Initialiser un dépôt",
      code: `git init`,
      d_fr: "Utilisez <code>git init</code> pour commencer à suivre un projet avec Git.",
      t_en: "2. Initialize Repository",
      d_en: "Use <code>git init</code> to start tracking a project with Git.",
      t_ar: "2. إنشاء مستودع",
      d_ar: "استخدم <code>git init</code> لبدء تتبع مشروعك باستخدام Git."
    },
    {
      icon: "fa-plus",
      t_fr: "3. Ajouter & Commiter",
      code: `git add .\ngit commit -m "Mon message"`,
      d_fr: "Ajoutez vos fichiers à la zone de staging puis enregistrez vos changements avec un commit.",
      t_en: "3. Add & Commit",
      d_en: "Add your files to the staging area and save your changes with a commit.",
      t_ar: "3. الإضافة والحفظ",
      d_ar: "إضافة الملفات ثم حفظ التغييرات باستخدام commit."
    },
    {
      icon: "fa-clock-rotate-left",
      t_fr: "4. Historique (Log)",
      code: `git log --oneline`,
      d_fr: "Consultez l'historique des modifications apportées au projet.",
      t_en: "4. History (Log)",
      d_en: "View the history of modifications made to the project.",
      t_ar: "4. التاريخ",
      d_ar: "عرض تاريخ التعديلات التي أجريت على المشروع."
    },
    {
      icon: "fa-code-branch",
      t_fr: "5. Branches",
      badge: "badge-important",
      code: `git checkout -b feature-test`,
      d_fr: "Utilisez les branches pour travailler sur de nouvelles fonctionnalités sans casser le code principal.",
      t_en: "5. Branches",
      d_en: "Use branches to work on new features without breaking the main codebase.",
      t_ar: "5. الفروع",
      d_ar: "استخدم الفروع للعمل على ميزات جديدة دون التأثير على الكود الرئيسي."
    },
    {
      icon: "fa-cloud-arrow-up",
      t_fr: "6. Push & Pull",
      code: `git push origin main\ngit pull origin main`,
      d_fr: "Envoyez vos changements sur GitHub (Push) ou récupérez les derniers changements (Pull).",
      t_en: "6. Push & Pull",
      d_en: "Send your changes to GitHub (Push) or retrieve the latest updates (Pull).",
      t_ar: "6. الرفع والجلب",
      d_ar: "رفع التغييرات إلى GitHub أو جلب التحديثات الجديدة."
    }
  ];

  const chaptersContainer = document.getElementById('gitLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  gitLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
