<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Playground - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .playground-wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 88px);
      margin-top: 88px;
    }
    .editor-section {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 50%;
      background: #0f172a;
      border-bottom: 2px solid var(--cl-line);
    }
    .editor-box {
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
    }
    .editor-header {
      background: #1e293b;
      color: #94a3b8;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-header i { margin-right: 8px; }
    textarea {
      flex: 1;
      width: 100%;
      background: #0d1117;
      color: #c9d1d9;
      border: none;
      padding: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    .preview-section {
      height: 50%;
      background: white;
      position: relative;
    }
    #preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .controls {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn-run {
      background: var(--cl-brand);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
    }
    .btn-run:hover { transform: scale(1.05); background: var(--cl-brand-dark); }
    
    @media (max-width: 768px) {
      .editor-section { grid-template-columns: 1fr; height: auto; }
      .playground-wrapper { height: auto; }
      .preview-section { height: 400px; }
      textarea { min-height: 200px; }
    }
  </style>
</head>
<body>

<div class="playground-wrapper">
  <div class="editor-section">
    <div class="editor-box">
      <div class="editor-header"><span><i class="fab fa-html5"></i> HTML</span></div>
      <textarea id="html-code" placeholder="Write HTML here..."><div class="card">
  <h1>Hello Coding Life!</h1>
  <p>Try editing the code to see live changes.</p>
</div></textarea>
    </div>
    <div class="editor-box">
      <div class="editor-header"><span><i class="fab fa-css3-alt"></i> CSS</span></div>
      <textarea id="css-code" placeholder="Write CSS here...">body { 
  font-family: 'Segoe UI', sans-serif; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  background: #f0fdfa; 
}
.card {
  padding: 40px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  text-align: center;
}
h1 { color: #0f766e; }</textarea>
    </div>
    <div class="editor-box">
      <div class="editor-header"><span><i class="fab fa-js"></i> JavaScript</span></div>
      <textarea id="js-code" placeholder="Write JS here...">console.log("Welcome to Playground!");</textarea>
    </div>
  </div>

  <div class="preview-section">
    <div class="controls">
      <button class="btn-run" onclick="runCode()"><i class="fas fa-play"></i> Run Code</button>
    </div>
    <iframe id="preview-iframe"></iframe>
  </div>
</div>

<script>
  function runCode() {
    const html = document.getElementById("html-code").value;
    const css = "<style>" + document.getElementById("css-code").value + "</style>";
    const js = "<script>" + document.getElementById("js-code").value + "<\/script>";
    const iframe = document.getElementById("preview-iframe").contentWindow.document;
    
    iframe.open();
    iframe.write(html + css + js);
    iframe.close();
  }

  // Live preview as user types
  document.querySelectorAll('textarea').forEach(textarea => {
    textarea.addEventListener('input', runCode);
  });

  window.onload = runCode;
</script>

<script src="site-polish.js"></script>
</body>
</html>
