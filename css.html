<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet CSS3 - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #1572b622;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #1572b6;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #1572b6, #33a9dc) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-css3-alt"></i> CSS3 Modern Styling</h1>
      <p>Master the art of visual design, responsive layouts, and modern animations.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-css3-alt"></i> تصميم CSS3 الحديث</h1>
      <p>أتقن فن التصميم البصري، التخطيطات المستجيبة، والرسوم المتحركة الحديثة.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-css3-alt"></i> Design CSS3 Moderne</h1>
      <p>Maîtrisez l'art du design visuel, des mises en page réactives et des animations.</p>
    </div>
  </div>

  <div class="chapters" id="cssLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const cssLessons = [
    {
      icon: "fa-magic",
      badge: "badge-modern",
      t_fr: "1. Introduction au CSS",
      d_fr: "CSS (Cascading Style Sheets) définit comment les éléments HTML sont affichés à l'écran.",
      t_en: "1. Intro to CSS",
      d_en: "CSS (Cascading Style Sheets) describes how HTML elements are to be displayed on screen.",
      t_ar: "1. مقدمة في CSS",
      d_ar: "تحدد CSS كيفية عرض عناصر HTML على الشاشة."
    },
    {
      icon: "fa-mouse-pointer",
      badge: "badge-important",
      t_fr: "2. Sélecteurs et Propriétés",
      d_fr: "Ciblez des éléments par tag, classe (.class) ou ID (#id) et changez leurs propriétés.",
      code: "h1 {\n  color: blue;\n  font-size: 20px;\n}",
      t_en: "2. Selectors & Properties",
      d_en: "Target elements by tag, class (.class), or ID (#id) and modify their properties.",
      t_ar: "2. المحددات والخصائص",
      d_ar: "استهدف العناصر عبر التاج أو الكلاس أو الـ ID وغير خصائصها."
    },
    {
      icon: "fa-box",
      badge: "badge-important",
      t_fr: "3. Le Box Model",
      d_fr: "Chaque élément est une boîte composée de : Content, Padding, Border, et Margin.",
      code: "div {\n  margin: 10px;\n  padding: 20px;\n  border: 1px solid black;\n}",
      t_en: "3. The Box Model",
      d_en: "Every element is a box consisting of: Content, Padding, Border, and Margin.",
      t_ar: "3. نموذج الصندوق",
      d_ar: "كل عنصر هو صندوق يتكون من: المحتوى، الحشو، الحدود، والهوامش."
    },
    {
      icon: "fa-palette",
      badge: "badge-modern",
      t_fr: "4. Couleurs et Backgrounds",
      d_fr: "Utilisez des couleurs Hex, RGB, HSL ou des dégradés (gradients).",
      code: "body {\n  background: linear-gradient(red, yellow);\n}",
      t_en: "4. Colors & Backgrounds",
      d_en: "Use Hex, RGB, HSL colors or background gradients.",
      t_ar: "4. الألوان والخلفيات",
      d_ar: "استخدم ألوان Hex أو RGB أو التدرجات اللونية."
    },
    {
      icon: "fa-font",
      badge: "badge-modern",
      t_fr: "5. Typographie",
      d_fr: "Gérez les polices, la taille du texte, le poids (weight) et l'espacement.",
      code: "p {\n  font-family: 'Arial';\n  line-height: 1.6;\n}",
      t_en: "5. Typography",
      d_en: "Control fonts, text size, weight, alignment, and line spacing.",
      t_ar: "5. الخطوط",
      d_ar: "تحكم في أنواع الخطوط وأحجامها وتباعد الأسطر."
    },
    {
      icon: "fa-arrows-alt",
      badge: "badge-important",
      t_fr: "6. Flexbox",
      d_fr: "Créez des mises en page flexibles et alignez facilement vos éléments.",
      code: ".container {\n  display: flex;\n  justify-content: center;\n}",
      t_en: "6. Flexbox",
      d_en: "Create flexible layouts and align elements easily within a container.",
      t_ar: "6. فليكس بوكس",
      d_ar: "أنشئ تخطيطات مرنة وقم بمحاذاة العناصر بسهولة."
    },
    {
      icon: "fa-th",
      badge: "badge-pro",
      t_fr: "7. CSS Grid",
      d_fr: "Le système de mise en page le plus puissant pour créer des grilles complexes.",
      code: ".grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n}",
      t_en: "7. CSS Grid",
      d_en: "The most powerful layout system for creating complex grid structures.",
      t_ar: "7. شبكة CSS (Grid)",
      d_ar: "أقوى نظام تخطيط لإنشاء هياكل شبكية معقدة."
    },
    {
      icon: "fa-mobile-alt",
      badge: "badge-important",
      t_fr: "8. Responsive Design",
      d_fr: "Utilisez les Media Queries pour adapter votre site à tous les écrans.",
      code: "@media (max-width: 600px) {\n  body { font-size: 14px; }\n}",
      t_en: "8. Responsive Design",
      d_en: "Use Media Queries to make your website look great on all devices.",
      t_ar: "8. التصميم المستجيب",
      d_ar: "استخدم Media Queries لجعل موقعك مناسباً لجميع الأجهزة."
    },
    {
      icon: "fa-running",
      badge: "badge-pro",
      t_fr: "9. Animations et Transitions",
      d_fr: "Donnez vie à votre site avec des effets de transition et des keyframes.",
      code: ".btn:hover { transition: 0.3s; transform: scale(1.1); }",
      t_en: "9. Animations & Transitions",
      d_en: "Bring your site to life with transition effects and keyframe animations.",
      t_ar: "9. الرسوم المتحركة",
      d_ar: "أضف الحيوية لموقعك باستخدام الانتقالات والرسوم المتحركة."
    },
    {
      icon: "fa-vial",
      badge: "badge-pro",
      t_fr: "10. Variables CSS",
      d_fr: "Utilisez des variables (custom properties) pour maintenir votre code propre.",
      code: ":root {\n  --main-color: #ff0000;\n}\nbody { color: var(--main-color); }",
      t_en: "10. CSS Variables",
      d_en: "Use custom properties (variables) to keep your CSS clean and maintainable.",
      t_ar: "10. متغيرات CSS",
      d_ar: "استخدم المتغيرات للحفاظ على نظافة وجودة كود الـ CSS."
    }
  ];

  const chaptersContainer = document.getElementById('cssLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  cssLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
