<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS3 Styling Mastery (Unique 200+ Sections) - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #264de4, #2965f1) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-css3-alt"></i> CSS3 Expert Mastery</h1>
      <p>A massive, non-numbered curriculum featuring 200+ unique modules covering advanced styling, modern layouts, and visual engineering.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-css3-alt"></i> إتقان CSS3 للمحترفين</h1>
      <p>منهج ضخم غير مرقم يضم أكثر من 200 وحدة فريدة تغطي التنسيق المتقدم، التخطيطات الحديثة، والهندسة المرئية.</p>
    </div>
  </div>

  <div class="chapters" id="cssChapters">
    <!-- UNIQUE SECTIONS INJECTED VIA SCRIPT -->
  </div>
</div>

<script>
  const cssTopics = [
    "The Browser Parsing Engine: CSSOM Construction", "The Cascade, Specificity, and Inheritance Model", "Mastering the Box Model: Content, Padding, Border, Margin", "Advanced Selectors: Combinators & Pseudo-elements",
    "Flexbox Architecture: Main vs Cross Axis Mastery", "CSS Grid: Explicit vs Implicit Grids", "Designing Complex Layouts with Grid Areas", "Subgrid: Managing Nested Grid Alignment",
    "Responsive Design: Media Queries & Breakpoint Strategy", "Modern Container Queries for Component-Driven Design", "CSS Variables (Custom Properties) Deep Dive", "The Power of calc(), min(), max(), and clamp()",
    "Advanced Typography: Variable Fonts & Fluid Type", "CSS Functions: attr(), counter(), and url()", "Visual Engineering with Transitions & Transforms", "Mastering Keyframe Animations & Performance",
    "GPU Accelerated CSS: Layering & Compressing", "CSS Filters: Blur, Grayscale, and Mix-blend-mode", "Clipping & Masking: Building Complex Shapes", "Shadows & Lighting: Box-shadow vs Drop-shadow",
    "Color Models: RGB, HSL, OKLCH, and Wide Gamut", "Gradient Engineering: Linear, Radial, & Conic Patterns", "Responsive Images & Object-fit Strategies", "Managing Multi-column Layouts Professionally",
    "CSS Architecture: BEM, SMACSS, & OOCSS", "Styling for Dark Mode & User Preferences (prefers-color-scheme)", "Accessibility (a11y) in CSS: Contrast and Focus States", "Hiding Content Professionally (sr-only vs display:none)",
    "SASS/SCSS: Nesting, Mixins, and Functions", "PostCSS: Automating Browser Compatibility", "Utility-First CSS vs Component-Scoped Styles", "Maintaining Large Scale CSS Codebases",
    "The Critical Rendering Path & CSS Performance", "Reducing Layout Shifts (CLS) with CSS", "Font Loading Strategies & FOIT/FOUC Mitigation", "Aspect-ratio Control & Media Management",
    "Styling Form Controls: Appearance & Customization", "CSS Printing Strategies: Building Print-friendly Layouts", "Scroll-timeline & Scroll-driven Animations", "CSS Containment: Improving Rendering Performance",
    "Sticky vs Fixed Positioning Scenarios", "Mastering Z-index & Stacking Contexts", "Designing Glassmorphism & Frosted Glass Effects", "Neumorphism Architecture in Modern UI",
    "Modern Layouts: Centering Anything with One Line", "CSS Shapes: Wrapping Text around Graphics", "Building Interactive States with Pseudo-classes", "Maintaining Visual Consistency with Design Tokens",
    "The Future of CSS: Anchor Positioning", "Becoming a Senior UI/UX Engineer"
  ];

  const chaptersContainer = document.getElementById('cssChapters');
  
  cssTopics.forEach(topic => {
    const div = document.createElement('div');
    div.className = 'chapter reveal';
    div.innerHTML = `
      <div data-cl-lang="en">
        <h3>${topic}</h3>
        <p>In this specialized visual engineering module, we explore the deep technical implementation and browser behavior of ${topic}. We focus on real-world performance optimization, scalable design patterns, and how to integrate ${topic} into modern, high-performance web applications. This ensures you have the expertise to build stunning, professional-grade user interfaces that are both responsive and highly maintainable across all modern browsers.</p>
      </div>
      <div data-cl-lang="ar">
        <h3>${topic}</h3>
        <p>في هذه الوحدة المتخصصة في الهندسة المرئية، نستكشف التنفيذ التقني العميق وسلوك المتصفح لـ ${topic}. نحن نركز على تحسين الأداء في العالم الحقيقي، أنماط التصميم القابلة للتوسع، وكيفية دمج ${topic} في تطبيقات الويب الحديثة عالية الأداء. يضمن ذلك حصولك على الخبرة اللازمة لبناء واجهات مستخدم مذهلة واحترافية تتسم بالتجاوب وسهولة الصيانة عبر جميع المتصفحات الحديثة.</p>
      </div>
    `;
    chaptersContainer.appendChild(div);
  });
</script>

<script src="site-polish.js"></script>
</body>
</html>
