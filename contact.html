<script>
  // AJAX for Contact Form
  const form = document.getElementById("contactForm");
  const status = document.getElementById("contact-status");
  
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.style.display = "block";
      status.style.color = "var(--cl-brand)";
      const lang = localStorage.getItem('cl-lang') || 'en';
      const msgs = {
        en: { sending: "Sending...", success: "Message Sent Successfully! âœ…", error: "Oops! Error sending message." },
        ar: { sending: "ط¬ط§ط±ظٹ ط§ظ„ط¥ط±ط³ط§ظ„...", success: "طھظ… ط¥ط±ط³ط§ظ„ ط§ظ„ط±ط³ط§ظ„ط© ط¨ظ†ط¬ط§ط­! âœ…", error: "ط¹ط°ط±ط§ظ‹! ط­ط¯ط« ط®ط·ط£ ظپظٹ ط§ظ„ط¥ط±ط³ط§ظ„." }
      };
      const currentMsgs = msgs[lang] || msgs.en;

      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      try {
        status.innerHTML = currentMsgs.sending;
        const response = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(data)
        });
        if (response.ok) {
          status.style.color = "var(--cl-success)";
          status.innerHTML = currentMsgs.success;
          form.reset();
        } else { throw new Error(); }
      } catch (err) {
        status.style.color = "var(--cl-error)";
        status.innerHTML = currentMsgs.error;
      }
    });
  }
</script>
