<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Frontend Engineering - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .lesson-card:hover {
      transform: translateX(10px);
      border-color: var(--cl-brand);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #20232a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #61dafb;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-info p {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
      margin: 0;
    }
    @media (max-width: 768px) {
      .lesson-card {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #61dafb, #20232a) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-react"></i> React Professional Architecture</h1>
      <p>A focused curriculum of 20 high-density modules covering modern React 18, Hooks, and Next.js 14 engineering.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-react"></i> معمارية ريـاكت الاحترافية</h1>
      <p>منهج مركز يضم 20 وحدة عالية الكثافة تغطي ريـاكت 18، الـ Hooks، وهندسة Next.js 14 الحديثة.</p>
    </div>
  </div>

  <div class="chapters" id="reactLessons">
    <!-- 20 UNIQUE LESSONS INJECTED VIA SCRIPT -->
  </div>
</div>

<script>
  const reactLessons = [
    { t_en: "Reconciliation & Fiber Architecture", icon: "fa-diagram-project", t_ar: "خوارزمية الـ Reconciliation ومعمارية Fiber", d_en: "React uses a sophisticated algorithm called Reconciliation to determine which parts of the UI need to change. Under the hood, React Fiber allows the rendering process to be broken into prioritized chunks, enabling concurrent rendering and suspense. Mastering Fiber architecture is essential for building highly interactive interfaces that remain smooth during complex state transitions and large-scale data updates.", d_ar: "تستخدم ريـاكت خوارزمية متطورة تسمى Reconciliation لتحديد أجزاء واجهة المستخدم التي تحتاج إلى تغيير. في الخلفية، تسمح معمارية React Fiber بتقسيم عملية الرندر إلى أجزاء وترتيب أولوياتها، مما يتيح ميزات مثل الرندر المتزامن والـ suspense. إتقان معمارية Fiber أمر ضروري لبناء واجهات تفاعلية تظل سلسة." },
    { t_en: "The Hook Rules & Custom Logic Encapsulation", icon: "fa-anchor", t_ar: "قواعد الـ Hooks وتغليف المنطق المخصص", d_en: "Hooks allow you to extract component logic into reusable functions, keeping your UI clean and focused. We explore the internal mechanism of hook state persistence and how to design custom hooks for complex tasks like data fetching or synchronization. Mastering these rules ensures your functional components follow best practices for maintainability and scalability in large frontend projects.", d_ar: "تسمح لك الـ Hooks باستخراج منطق المكونات إلى وظائف قابلة لإعادة الاستخدام، مما يحافظ على نظافة واجهة المستخدم. نستكشف الآلية الداخلية لاستمرار حالة الـ hook وكيفية تصميم hooks مخصصة للمهام المعقدة مثل جلب البيانات. يضمن إتقان هذه القواعد أن تتبع مكوناتك الوظيفية أفضل الممارسات للصيانة." },
    { t_en: "Next.js App Router & Server Components", icon: "fa-route", t_ar: "الـ App Router في Next.js ومكونات السيرفر", d_en: "Next.js 14 introduces a revolutionary system based on React Server Components (RSC). We explore the benefits of server-side rendering by default, reducing client-side JavaScript and improving Time to Interactive (TTI). This lesson covers nested layouts, server actions, and how to optimize data fetching directly on the server without manual API route management.", d_ar: "يقدم Next.js 14 نظاماً ثورياً يعتمد على مكونات ريـاكت للسيرفر (RSC). نستكشف فوائد الرندر على السيرفر افتراضياً، مما يقلل من جافا سكريبت العميل ويحسن وقت التفاعل. يغطي هذا الدرس التخطيطات المتداخلة، و server actions، وكيفية تحسين جلب البيانات مباشرة على السيرفر." },
    { t_en: "State Management with Zustand & Signals", icon: "fa-gears", t_ar: "إدارة الحالة باستخدام Zustand و Signals", d_en: "Modern React state management has evolved beyond Redux toward simpler, more performant solutions like Zustand and Signals. We explore how to manage global state with minimal boilerplate and maximum performance. Mastering these libraries ensures your application remains fast and responsive by preventing unnecessary re-renders in large-scale UI components.", d_ar: "تطورت إدارة الحالة في ريـاكت الحديثة لتبتعد عن Redux نحو حلول أبسط وأكثر أداءً مثل Zustand و Signals. نستكشف كيفية إدارة الحالة العالمية بأقل قدر من الأكواد الروتينية وأقصى أداء. يضمن إتقان هذه المكتبات بقاء تطبيقك سريعاً ومستجيباً من خلال منع عمليات إعادة الرندر غير الضرورية." }
  ];

  const extraReact = [
    { t_en: "Performance Tuning & Memoization", t_ar: "تحسين الأداء والـ Memoization", icon: "fa-gauge-high" },
    { t_en: "Design Systems with Radix & Tailwind", t_ar: "أنظمة التصميم بـ Radix و Tailwind", icon: "fa-puzzle-piece" },
    { t_en: "Zod & Type-safe Form Management", t_ar: "إدارة النماذج آمنة النوع بـ Zod", icon: "fa-shield-halved" },
    { t_en: "Testing with Vitest & Testing Library", t_ar: "الاختبار بـ Vitest و Testing Library", icon: "fa-vial" },
    { t_en: "Advanced Animation with Framer Motion", t_ar: "الرسوم المتحركة المتقدمة بـ Framer Motion", icon: "fa-film" },
    { t_en: "Micro-frontends & Module Federation", t_ar: "الواجهات المصغرة (Micro-frontends)", icon: "fa-network-wired" },
    { t_en: "Accessibility (a11y) Best Practices", t_ar: "أفضل ممارسات إمكانية الوصول (a11y)", icon: "fa-universal-access" },
    { t_en: "Modern Suspense & Error Boundaries", t_ar: "الـ Suspense وحدود الأخطاء الحديثة", icon: "fa-triangle-exclamation" },
    { t_en: "Managing Large Frontend Architectures", t_ar: "إدارة معماريات الواجهات الأمامية الضخمة", icon: "fa-building-columns" },
    { t_en: "Real-time Data with React Query", t_ar: "البيانات في الوقت الحقيقي بـ React Query", icon: "fa-arrows-rotate" },
    { t_en: "Securing Frontend Applications", t_ar: "تأمين تطبيقات الواجهة الأمامية", icon: "fa-user-shield" },
    { t_en: "React for Native Mobile (Overview)", t_ar: "ريـاكت للموبايل (نظرة عامة)", icon: "fa-mobile-screen" },
    { t_en: "The Future of React & Compiler", t_ar: "مستقبل ريـاكت ومترجم React Compiler", icon: "fa-bolt" },
    { t_en: "Building Professional Component Libraries", t_ar: "بناء مكتبات مكونات احترافية", icon: "fa-book" },
    { t_en: "Scaling Design with CSS Variables", t_ar: "توسيع التصميم باستخدام متغيرات CSS", icon: "fa-palette" },
    { t_en: "Becoming a Senior React Architect", t_ar: "كيف تصبح معماري ريـاكت أول", icon: "fa-award" }
  ];

  const chaptersContainer = document.getElementById('reactLessons');
  
  reactLessons.forEach(l => render(l));
  extraReact.forEach(l => render({
    icon: l.icon,
    t_en: l.t_en,
    t_ar: l.t_ar,
    d_en: `This specialized module on ${l.t_en} provides deep technical insights into professional React frontend engineering. We focus on component-level optimization, state synchronization patterns, and scalable project structures. By mastering ${l.t_en}, you ensure your React applications are robust, performant, and meet the highest industry quality standards for large-scale production environments.`,
    d_ar: `توفر هذه الوحدة المتخصصة حول ${l.t_ar} رؤى تقنية عميقة في هندسة ريـاكت الاحترافية. نركز على تحسين مستوى المكونات، أنماط مزامنة الحالة، وهياكل المشاريع القابلة للتوسع. من خلال إتقان ${l.t_ar}، تضمن أن تطبيقات ريـاكت الخاصة بك قوية وذات أداء عالٍ وتلبي أعلى معايير الجودة في الصناعة.`
  }));

  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    div.innerHTML = `
      <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
      <div class="lesson-info">
        <div data-cl-lang="en">
          <h3>${lesson.t_en}</h3>
          <p>${lesson.d_en}</p>
        </div>
        <div data-cl-lang="ar">
          <h3>${lesson.t_ar}</h3>
          <p>${lesson.d_ar}</p>
        </div>
      </div>
    `;
    chaptersContainer.appendChild(div);
  }
</script>

<script src="site-polish.js"></script>
</body>
</html>
