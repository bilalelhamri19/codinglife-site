<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours Complet React - Coding Life</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Pacifico&family=Fira+Code&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site-polish.css">
  <style>
    .lesson-card {
      background: var(--cl-surface);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid var(--cl-line);
      transition: var(--cl-transition);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lesson-header {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lesson-card:hover {
      transform: translateY(-5px);
      border-color: var(--cl-brand);
      box-shadow: var(--cl-shadow-lg);
    }
    .lesson-icon {
      width: 60px;
      height: 60px;
      background: #61dafb22;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #61dafb;
      flex-shrink: 0;
    }
    .lesson-info {
      flex-grow: 1;
    }
    .lesson-info h3 {
      font-size: 1.5rem;
      color: var(--cl-brand);
      margin-bottom: 12px;
      margin-top: 0;
    }
    .lesson-content {
      line-height: 1.8;
      color: var(--cl-muted);
      font-size: 1.05rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-modern { background: #e0f2fe; color: #0369a1; }
    .badge-important { background: #fee2e2; color: #b91c1c; }
    .badge-pro { background: #fef3c7; color: #b45309; }

    .code-block {
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 15px 0;
      border: 1px solid #30363d;
    }

    @media (max-width: 768px) {
      .lesson-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="course-container">
  <div class="course-header" style="background: linear-gradient(135deg, #20232a, #61dafb) !important;">
    <div data-cl-lang="en">
      <h1><i class="fab fa-react"></i> React Frontend Mastery</h1>
      <p>Master component-based architecture and build powerful user interfaces.</p>
    </div>
    <div data-cl-lang="ar">
      <h1><i class="fab fa-react"></i> إتقان React</h1>
      <p>احترف المعمارية القائمة على المكونات وبناء واجهات مستخدم قوية.</p>
    </div>
    <div data-cl-lang="fr">
      <h1><i class="fab fa-react"></i> Maîtrise React</h1>
      <p>Maîtrisez l'architecture par composants et créez des interfaces utilisateur puissantes.</p>
    </div>
  </div>

  <div class="chapters" id="reactLessons">
    <!-- Lessons will be injected here -->
  </div>
</div>

<script>
  const reactLessons = [
    {
      icon: "fa-atom",
      t_fr: "1. Qu’est-ce que React ?",
      d_fr: "React est une bibliothèque JavaScript pour créer des interfaces utilisateur basées sur des composants.",
      t_en: "1. What is React?",
      d_en: "React is a JavaScript library for building user interfaces based on components.",
      t_ar: "1. ما هو React؟",
      d_ar: "React هي مكتبة جافا سكريبت لبناء واجهات المستخدم بناءً على المكونات."
    },
    {
      icon: "fa-puzzle-piece",
      t_fr: "2. Les Composants",
      code: `function Welcome() {\n  return <h1>Bonjour</h1>;\n}`,
      d_fr: "Les composants sont les blocs de base d'une application React.",
      t_en: "2. Components",
      d_en: "Components are the building blocks of any React application.",
      t_ar: "2. المكونات (Components)",
      d_ar: "المكونات هي حجر الأساس لأي تطبيق React."
    },
    {
      icon: "fa-code",
      t_fr: "3. JSX",
      d_fr: "JSX est une extension de syntaxe qui ressemble au HTML mais s'utilise dans JavaScript.",
      t_en: "3. JSX",
      d_en: "JSX is a syntax extension that looks like HTML but lives in JavaScript.",
      t_ar: "3. JSX",
      d_ar: "JSX هي إضافة لبناء الجملة تشبه HTML ولكنها تُستخدم داخل جافا سكريبت."
    },
    {
      icon: "fa-toggle-on",
      t_fr: "4. Props & State",
      badge: "badge-important",
      code: `const [count, setCount] = useState(0);`,
      d_fr: "Utilisez les Props pour passer des données et le State pour gérer les changements.",
      t_en: "4. Props & State",
      d_en: "Use Props to pass data and State to manage dynamic changes.",
      t_ar: "4. الـ Props والـ State",
      d_ar: "استخدام الـ Props لتمرير البيانات والـ State لإدارة التغييرات."
    },
    {
      icon: "fa-hook",
      t_fr: "5. Les Hooks (useEffect)",
      badge: "badge-pro",
      code: `useEffect(() => {\n  console.log("Monté !");\n}, []);`,
      d_fr: "Gérer les effets de bord et le cycle de vie des composants.",
      t_en: "5. Hooks (useEffect)",
      d_en: "Handle side effects and component lifecycle events.",
      t_ar: "5. الـ Hooks",
      d_ar: "التعامل مع التأثيرات الجانبية ودورة حياة المكون."
    },
    {
      icon: "fa-list",
      t_fr: "6. Listes & Clés",
      code: `{items.map(item => <li key={item.id}>{item.name}</li>)}`,
      d_fr: "Afficher des listes d'éléments de manière dynamique avec map().",
      t_en: "6. Lists & Keys",
      d_en: "Render lists of elements dynamically using map() and keys.",
      t_ar: "6. القوائم والمفاتيح",
      d_ar: "عرض قوائم العناصر بشكل ديناميكي."
    }
  ];

  const chaptersContainer = document.getElementById('reactLessons');
  
  function render(lesson) {
    const div = document.createElement('div');
    div.className = 'lesson-card reveal';
    
    let badgeHtml = lesson.badge ? `<span class="badge ${lesson.badge}">${lesson.badge.split('-')[1]}</span>` : '';
    let codeHtml = lesson.code ? `<div class="code-block"><pre>${lesson.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre></div>` : '';
    
    div.innerHTML = `
      <div class="lesson-header">
        <div class="lesson-icon"><i class="fas ${lesson.icon}"></i></div>
        <div class="lesson-info">
          <div data-cl-lang="fr"><h3>${lesson.t_fr}</h3></div>
          <div data-cl-lang="en"><h3>${lesson.t_en}</h3></div>
          <div data-cl-lang="ar"><h3>${lesson.t_ar}</h3></div>
          ${badgeHtml}
        </div>
      </div>
      <div class="lesson-content">
        <div data-cl-lang="fr">${lesson.d_fr || ''}</div>
        <div data-cl-lang="en">${lesson.d_en || ''}</div>
        <div data-cl-lang="ar">${lesson.d_ar || ''}</div>
        ${codeHtml}
      </div>
    `;
    chaptersContainer.appendChild(div);
  }

  reactLessons.forEach(l => render(l));
</script>

<script src="site-polish.js"></script>
</body>
</html>
